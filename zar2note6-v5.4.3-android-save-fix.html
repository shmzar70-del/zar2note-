<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Maestro + Mic Studio v5.4.2 — MIDI I/O + Save As + Silence Fix</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#1a1a1a;color:#e8e8e8;user-select:none}
button{font-family:inherit;cursor:pointer;border:0;background:transparent;color:inherit;padding:0}
button:focus-visible{outline:2px solid #4dabff;outline-offset:2px}

.topbar{background:#1e1e1e;padding:8px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #000;position:relative;z-index:20;flex-wrap:wrap}
.btn-yellow{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a;font-weight:700;padding:10px 18px;border-radius:8px;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 12px rgba(251,191,36,.35);transition:all .15s;white-space:nowrap}
.btn-yellow:hover{background:linear-gradient(135deg,#fcd34d,#fbbf24);box-shadow:0 4px 18px rgba(251,191,36,.55);transform:translateY(-1px)}
.btn-yellow:active{transform:translateY(0)}
.btn-yellow svg{width:18px;height:18px}
.btn-yellow:disabled{opacity:.55;cursor:wait;transform:none}
.topbar-info{color:#888;font-size:12px;margin-left:auto}
.topbar-info b{color:#fbbf24}

.inst-select{background:#333;color:#e8e8e8;border:1px solid #444;border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;cursor:pointer}
.inst-select:focus{outline:2px solid #4dabff;outline-offset:1px}

.toolbar{background:#252525;border-bottom:1px solid #000;display:flex;flex-direction:column;position:relative;z-index:10}
.toolbar-viewport{overflow:hidden;position:relative}
.toolbar-track{display:flex;transition:transform .25s ease;will-change:transform}
.section{flex:0 0 auto;min-width:120px;padding:8px 14px 12px;border-right:1px solid #333;position:relative}
.section::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent,#555);opacity:.85}
.section-num{position:absolute;top:4px;left:10px;font-size:11px;color:#7a7a7a;font-weight:600}
.section-row{display:flex;gap:6px;align-items:center;margin-top:14px;min-height:36px}
.icon-btn{width:44px;height:36px;border-radius:6px;background:#333;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;color:#ccc}
.icon-btn:hover{background:#3d3d3d}
.icon-btn.active{background:#4dabff;color:#fff;box-shadow:0 0 0 2px rgba(77,171,255,.35)}
.icon-btn svg{width:22px;height:24px}
.icon-btn.wide{width:auto;padding:0 10px;font-size:13px;font-weight:600}
.icon-btn.undo-btn{background:#3a2a5a;color:#d4c5f0}
.icon-btn.undo-btn:hover{background:#4a3570}
.icon-btn.redo-btn{background:#3a2a5a;color:#d4c5f0}
.icon-btn.redo-btn:hover{background:#4a3570}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn:disabled:hover{background:#333}

#btnArp.active{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;box-shadow:0 0 0 2px rgba(244,63,94,.5),0 0 14px rgba(244,63,94,.6)}
#btnTab.active{background:linear-gradient(135deg,#22d3ee,#0891b2);color:#fff;box-shadow:0 0 0 2px rgba(34,211,238,.5)}
#btnRepeatStart.active{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;box-shadow:0 0 0 2px rgba(249,115,22,.5)}
#btnRepeatEnd.active{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;box-shadow:0 0 0 2px rgba(249,115,22,.5)}
.repeat-target{padding:3px 8px;border-radius:6px;background:#1a1a1a;border:1px solid #444;color:#fbbf24;font-size:11px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
.repeat-target b{color:#fff}

.sel-btn{height:36px;border-radius:6px;background:#333;color:#ddd;border:0;padding:0 8px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.sel-btn:hover{background:#3d3d3d}
.sel-btn:focus{outline:2px solid #4dabff;outline-offset:1px}

.scroll-bar{display:flex;justify-content:flex-end;background:#1e1e1e;border-top:1px solid #000;padding:2px 4px}
.scroll-btn{background:#333;color:#bbb;padding:6px 20px;font-size:11px;font-weight:600;letter-spacing:.6px;margin-left:2px;border-radius:4px}
.scroll-btn:hover{background:#3d3d3d;color:#fff}
.scroll-btn:disabled{opacity:.35;cursor:default}

.main{position:absolute;inset:0;display:flex;flex-direction:column;background:#1a1a1a}
.score-area{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;padding-top:70px}
.score-header{position:absolute;top:0;left:0;right:0;padding:14px 40px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.tempo-mark{pointer-events:auto;display:flex;flex-direction:column;gap:2px}
.tempo-row{display:flex;align-items:center;gap:8px;color:#e8e8e8;font-size:15px}
.tempo-row .quarter{font-size:26px;line-height:1}
.tempo-row input{background:transparent;border:0;color:#e8e8e8;font-size:15px;width:44px;text-align:center;padding:2px 0;font-family:inherit}
.tempo-row input:focus{outline:1px solid #4dabff;border-radius:4px}
.tempo-text{font-style:italic;color:#bbb;font-size:13px;background:transparent;border:0;font-family:inherit;width:120px;padding:0}
.tempo-text:focus{outline:1px solid #4dabff;border-radius:4px}
.score-title-wrap{pointer-events:auto;text-align:center;flex:1}
.score-title{font-size:32px;font-weight:500;color:#fff;background:transparent;border:0;text-align:center;font-family:inherit;width:100%;padding:4px 0}
.score-title:focus{outline:1px dashed #4dabff;border-radius:8px}
.score-composer{font-size:13px;color:#999;background:transparent;border:0;text-align:center;font-family:inherit;width:100%;padding:0}
.maestro-badge{pointer-events:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.maestro-badge .badge{background:#3a3a3a;color:#ddd;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500}
.ctrl-buttons{display:flex;gap:8px;align-items:center}
.ctrl-btn{width:48px;height:48px;border-radius:50%;background:#3a3a3a;color:#ddd;display:flex;align-items:center;justify-content:center;font-size:18px}
.ctrl-btn:hover{background:#484848}
.ctrl-btn.primary{background:#c98a3a;color:#fff}
.ctrl-btn.primary:hover{background:#d99a4a}

.instrument-label{position:absolute;top:158px;left:40px;font-style:italic;color:#ccc;font-size:14px;pointer-events:none;z-index:4;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.arp-badge{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;font-style:normal;font-weight:700;font-size:11px;padding:4px 10px;border-radius:12px;letter-spacing:.5px;box-shadow:0 0 10px rgba(244,63,94,.5);display:none}
.arp-badge.on{display:inline-block}
.arp-badge .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:6px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.tab-badge{background:linear-gradient(135deg,#22d3ee,#0891b2);color:#fff;font-style:normal;font-weight:700;font-size:11px;padding:4px 10px;border-radius:12px;letter-spacing:.5px;display:none}
.tab-badge.on{display:inline-block}
.repeat-badge{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;font-style:normal;font-weight:700;font-size:11px;padding:4px 10px;border-radius:12px;letter-spacing:.5px;display:none}
.repeat-badge.on{display:inline-block}
.mic-badge{background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-style:normal;font-weight:700;font-size:11px;padding:4px 10px;border-radius:12px;letter-spacing:.5px;display:none}
.mic-badge.on{display:inline-block}
.mic-badge .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:6px;animation:pulse 1s infinite}

.finger-legend{display:flex;gap:6px;font-style:normal;font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;background:#2a2a2a;border:1px solid #3a3a3a}
.finger-legend span{padding:1px 5px;border-radius:5px;color:#111}

.score-viewport{flex:1;overflow-x:auto;overflow-y:hidden;position:relative;padding:0;scroll-behavior:auto;-webkit-overflow-scrolling:touch}
#score{display:block;background:transparent}

.status-bar{background:#252525;border-top:1px solid #000;padding:6px 16px;display:flex;align-items:center;font-size:12px;color:#999;gap:16px}
.status-bar .battery{display:flex;align-items:center;gap:6px}
.battery-icon{width:22px;height:11px;border:1.5px solid #999;border-radius:2px;position:relative;padding:1px}
.battery-icon::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:5px;background:#999;border-radius:0 2px 2px 0}
.battery-icon i{display:block;height:100%;background:#999;border-radius:1px}
.status-msg{margin-left:auto}

.note-head{fill:#e8e8e8}
.note-head.open{fill:none;stroke:#e8e8e8;stroke-width:1.6}
.note-stem{stroke:#e8e8e8;stroke-width:1.6}
.note-flag{fill:#e8e8e8}
.note-acc{fill:#e8e8e8;font-size:20px;font-family:Georgia,serif}
.staff-line{stroke:#555;stroke-width:1}
.bar-line{stroke:#888;stroke-width:1.2}
.bar-line.thick{stroke-width:3}
.ledger{stroke:#888;stroke-width:1.2}
.clef{fill:#e8e8e8;font-family:Georgia,serif}
.time-sig{fill:#e8e8e8;font-family:Georgia,serif;font-weight:bold}
.measure-num{fill:#888;font-size:11px;font-family:Arial,sans-serif;cursor:pointer}
.measure-num:hover{fill:#fbbf24}
.measure-num.selected{fill:#fbbf24;font-weight:700}
.measure-num.has-repeat{fill:#f97316;font-weight:700}
.dyn-mark{fill:#ddd;font-family:Georgia,serif;font-style:italic;font-weight:bold}
.tuplet-num{fill:#ccc;font-size:11px}
.needs-barline{fill:#e0a34c;font-size:10px;font-weight:bold;font-family:Arial;letter-spacing:.5px}
.playhead{stroke:#2a7fbf;stroke-width:4;pointer-events:none;filter:drop-shadow(0 0 4px #2a7fbf)}
.note-playing .note-head,.note-playing .note-flag{fill:#4dabff !important}
.note-playing .note-stem{stroke:#4dabff !important}
.note-selected .note-head{stroke:#ff5e9c !important;stroke-width:2.5}
.note-selected.open .note-head{stroke:#ff5e9c !important;fill:rgba(255,94,156,.2)}
.note-hit{cursor:grab;touch-action:none}
.ghost-measure{fill:transparent;stroke:#4a4a4a;stroke-width:1;stroke-dasharray:5 5;cursor:pointer}
.ghost-measure:hover{stroke:#fbbf24;stroke-dasharray:none}
.ghost-plus{fill:#555;font-size:28px;font-family:Arial;text-anchor:middle;pointer-events:none}

.repeat-dot{fill:#f97316}
.repeat-line{stroke:#f97316;stroke-width:3}
.repeat-line-thin{stroke:#f97316;stroke-width:1.4}
.repeat-marker{fill:#f97316;font-size:10px;font-family:Arial;font-weight:700;letter-spacing:.5px}

.arp-note .note-halo{fill:rgba(255,255,255,.08)}
.arp-note.arp-fp .note-head,.arp-note.arp-fp .note-flag{fill:#ef4444 !important}
.arp-note.arp-fp .note-head.open{fill:none !important;stroke:#ef4444 !important;stroke-width:1.8}
.arp-note.arp-fp .note-stem{stroke:#ef4444 !important}
.arp-note.arp-fp .note-acc{fill:#ef4444 !important}
.arp-note.arp-fp .note-halo{fill:rgba(239,68,68,.22)}
.arp-note.arp-fi .note-head,.arp-note.arp-fi .note-flag{fill:#3b82f6 !important}
.arp-note.arp-fi .note-head.open{fill:none !important;stroke:#3b82f6 !important;stroke-width:1.8}
.arp-note.arp-fi .note-stem{stroke:#3b82f6 !important}
.arp-note.arp-fi .note-acc{fill:#3b82f6 !important}
.arp-note.arp-fi .note-halo{fill:rgba(59,130,246,.22)}
.arp-note.arp-fm .note-head,.arp-note.arp-fm .note-flag{fill:#22c55e !important}
.arp-note.arp-fm .note-head.open{fill:none !important;stroke:#22c55e !important;stroke-width:1.8}
.arp-note.arp-fm .note-stem{stroke:#22c55e !important}
.arp-note.arp-fm .note-acc{fill:#22c55e !important}
.arp-note.arp-fm .note-halo{fill:rgba(34,197,94,.22)}
.arp-note.arp-fa .note-head,.arp-note.arp-fa .note-flag{fill:#a855f7 !important}
.arp-note.arp-fa .note-head.open{fill:none !important;stroke:#a855f7 !important;stroke-width:1.8}
.arp-note.arp-fa .note-stem{stroke:#a855f7 !important}
.arp-note.arp-fa .note-acc{fill:#a855f7 !important}
.arp-note.arp-fa .note-halo{fill:rgba(168,85,247,.22)}

.tab-line{stroke:#6b6b6b;stroke-width:1}
.tab-num{fill:#e8e8e8;font-size:13px;font-weight:700;font-family:"Courier New",monospace}
.tab-clef{fill:#cfcfcf;font-family:Georgia,serif;font-size:13px;letter-spacing:1.5px}
.tab-string-label{fill:#7a7a7a;font-size:9px;font-family:Arial}
.tab-num-arp{font-size:13px;font-weight:800;font-family:"Courier New",monospace}
.tab-num-arp.tab-fp{fill:#ef4444}
.tab-num-arp.tab-fi{fill:#3b82f6}
.tab-num-arp.tab-fm{fill:#22c55e}
.tab-num-arp.tab-fa{fill:#a855f7}
.tab-halo.tab-fp{fill:rgba(239,68,68,.18);stroke:#ef4444;stroke-width:1;stroke-opacity:.6}
.tab-halo.tab-fi{fill:rgba(59,130,246,.18);stroke:#3b82f6;stroke-width:1;stroke-opacity:.6}
.tab-halo.tab-fm{fill:rgba(34,197,94,.18);stroke:#22c55e;stroke-width:1;stroke-opacity:.6}
.tab-halo.tab-fa{fill:rgba(168,85,247,.18);stroke:#a855f7;stroke-width:1;stroke-opacity:.6}
.tab-finger{font-size:11px;font-family:Georgia,serif;font-style:italic;font-weight:800}
.finger-p{fill:#ef4444}
.finger-i{fill:#3b82f6}
.finger-m{fill:#22c55e}
.finger-a{fill:#a855f7}
.staff-finger{font-size:11px;font-weight:800;font-family:Georgia,serif;font-style:italic}

.drop-overlay{position:fixed;inset:0;background:rgba(26,26,26,.92);z-index:200;display:none;align-items:center;justify-content:center;pointer-events:none}
.drop-overlay.active{display:flex}
.drop-overlay .box{border:4px dashed #fbbf24;border-radius:24px;padding:60px 80px;text-align:center;background:rgba(251,191,36,.08)}
.drop-overlay .box h2{margin:0 0 8px;font-size:28px;color:#fbbf24}
.drop-overlay .box p{margin:0;color:#ccc;font-size:14px}

.samp-item{width:100%;text-align:left;padding:9px 12px;border-radius:6px;font-size:13px;color:#e8e8e8;display:block}
.samp-item:hover{background:#333}

.mic-panel{
  position:fixed;top:70px;right:16px;width:320px;background:#1e1e1e;
  border:1px solid #333;border-radius:14px;box-shadow:0 20px 60px #000c;
  z-index:180;display:none;font-size:13px;overflow:hidden;
  animation:micSlide .22s ease-out;
}
.mic-panel.open{display:block}
@keyframes micSlide{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.mic-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:#252525;border-bottom:1px solid #000;
  font-weight:700;color:#10b981;font-size:13px;
}
.mic-header .close{
  width:26px;height:26px;border-radius:50%;background:#333;color:#ccc;
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.mic-header .close:hover{background:#f43f5e;color:#fff}
.mic-body{padding:14px}
.mic-note{
  font-size:44px;font-weight:800;font-family:Georgia,serif;
  text-align:center;line-height:1;margin-bottom:10px;
  color:#555;transition:color .15s;
}
.mic-note.active{color:#fbbf24}
.mic-note.clean{color:#22c55e}
.mic-info{
  display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;
  font-family:"Courier New",monospace;font-size:11px;color:#888;
  margin-bottom:10px;
}
.mic-info b{color:#eee;font-weight:600}
.mic-tuner{
  width:100%;height:14px;background:#111;border-radius:7px;
  position:relative;overflow:hidden;border:1px solid #333;margin-bottom:12px;
}
.mic-tuner::after{
  content:"";position:absolute;left:50%;top:0;bottom:0;
  width:2px;background:#444;z-index:2;
}
.mic-needle{
  position:absolute;top:2px;bottom:2px;width:6px;background:#fbbf24;
  border-radius:3px;transition:left .12s,background .2s;z-index:1;left:50%;
}
.mic-controls{display:flex;gap:8px;margin-bottom:10px}
.mic-controls button{
  flex:1;padding:10px;border-radius:8px;font-weight:700;font-size:13px;
  color:#fff;transition:opacity .15s,transform .1s;
}
.mic-controls button:active{transform:scale(.97)}
.mic-controls button:disabled{opacity:.35;cursor:not-allowed}
#micStartBtn{background:linear-gradient(135deg,#10b981,#059669)}
#micStopBtn{background:linear-gradient(135deg,#f43f5e,#e11d48)}
.mic-options{
  display:flex;flex-direction:column;gap:8px;padding-top:8px;
  border-top:1px solid #333;
}
.mic-options label{
  display:flex;align-items:center;gap:8px;color:#bbb;font-size:12px;
}
.mic-options select{
  background:#333;color:#e8e8e8;border:1px solid #444;border-radius:6px;
  padding:6px 8px;font-size:12px;font-family:inherit;width:100%;
}
.mic-rec-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:#ef4444;margin-right:6px;animation:pulse 1s infinite;
  vertical-align:middle;
}

.env-warning{
  display:none;
  background:linear-gradient(135deg,#7c2d12,#991b1b);
  color:#fee2e2;
  padding:8px 14px;
  font-size:12px;
  border-bottom:1px solid #000;
  text-align:center;
}
.env-warning.show{display:block}
.env-warning b{color:#fbbf24}
.env-warning code{
  background:#000;padding:1px 6px;border-radius:4px;
  font-family:"Courier New",monospace;font-size:11px;
}

@media(max-width:900px){
  .section{min-width:100px;padding:6px 10px 10px}
  .icon-btn{width:38px;height:32px}
  .score-title{font-size:22px}
  .score-header{padding:8px 20px 0}
  .instrument-label{top:120px;left:20px;font-size:12px}
  .score-area{padding-top:56px}
  .ctrl-btn{width:40px;height:40px}
  .btn-yellow{padding:8px 12px;font-size:12px}
  .mic-panel{width:290px;right:8px;top:60px}
}
</style>
</head>
<body>

<div class="main">

  <div class="topbar">
    <button class="btn-yellow" id="btnImportYellow" title="Open MusicXML / MXL file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Open XML
    </button>
    <button class="btn-yellow" id="btnExportYellow" style="background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;box-shadow:0 3px 12px rgba(167,139,250,.35)" title="Save XML — asks for filename & location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Save XML
    </button>

    <button class="btn-yellow" id="btnMidiImport"
            style="background:linear-gradient(135deg,#818cf8,#4f46e5);color:#fff;box-shadow:0 3px 12px rgba(129,140,248,.4)"
            title="Import a Standard MIDI File (.mid / .midi)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M7 4v10M12 4v10M17 4v10"/>
        <path d="M3 14h18"/>
      </svg>
      Import MIDI
    </button>

    <button class="btn-yellow" id="btnMidiExport"
            style="background:linear-gradient(135deg,#c084fc,#9333ea);color:#fff;box-shadow:0 3px 12px rgba(192,132,252,.4)"
            title="Export the score as a Standard MIDI File (.mid)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M7 4v10M12 4v10M17 4v10"/>
        <path d="M3 14h18"/>
      </svg>
      Export MIDI
    </button>

    <button class="btn-yellow" id="btnPdfYellow"
            style="background:linear-gradient(135deg,#f472b6,#db2777);color:#fff;box-shadow:0 3px 12px rgba(244,114,182,.35)"
