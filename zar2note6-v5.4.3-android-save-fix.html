const PDF_PROPS = [
  "fill","fill-opacity","fill-rule",
  "stroke","stroke-width","stroke-opacity","stroke-linecap","stroke-linejoin",
  "stroke-dasharray","stroke-dashoffset",
  "opacity",
  "font-family","font-size","font-weight","font-style","letter-spacing",
  "text-anchor","dominant-baseline"
];
function pdfParseColor(c){
  if(!c) return null;
  c = String(c).trim();
  if(c === "none" || c === "transparent") return null;
  let m = c.match(/^rgba?\(([^)]+)\)$/i);
  if(m){
    const p = m[1].split(/[,\s\/]+/).filter(Boolean).map(Number);
    if(p.length >= 3) return { r:p[0], g:p[1], b:p[2], a: p.length > 3 ? p[3] : 1 };
    return null;
  }
  if(c.charAt(0) === "#"){
    let h = c.slice(1);
    if(h.length === 3) h = h.split("").map(x => x + x).join("");
    if(h.length === 6 || h.length === 8){
      return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16),
               b:parseInt(h.slice(4,6),16),
               a: h.length === 8 ? parseInt(h.slice(6,8),16)/255 : 1 };
    }
  }
  return null;
}
function pdfIsLight(c){
  const p = pdfParseColor(c);
  if(!p || p.a === 0) return false;
  const lum = (0.2126*p.r + 0.7152*p.g + 0.0722*p.b) / 255;
  return lum > 0.65;
}
const PDF_GHOST_CLASSES = ["ghost-measure", "ghost-plus", "playhead", "mic-badge"];

function pdfRasterizeSlice(x0, w, h, pxPerUnit){
  return new Promise((resolve, reject) => {
    try{
      const clone = svgRoot.cloneNode(true);
      const src = [svgRoot, ...svgRoot.querySelectorAll("*")];
      const dst = [clone,   ...clone.querySelectorAll("*")];
      for(let i = 0; i < src.length && i < dst.length; i++){
        const s = src[i], d = dst[i];
        if(!s || !d || d.nodeType !== 1) continue;
        const tag = d.tagName.toLowerCase();
        if(tag === "style" || tag === "script") continue;
        const cls = s.getAttribute("class") || "";
        if(PDF_GHOST_CLASSES.some(c => cls.includes(c))){
          d.setAttribute("style", "display:none;");
          d.removeAttribute("class");
          continue;
        }
        const cs = window.getComputedStyle(s);
        const isTabBg = cls.split(/\s+/).includes("tab-bg");
        let css = "";
        for(const p of PDF_PROPS){
          let v = cs.getPropertyValue(p);
          if(!v) continue;
          if(p === "fill" && isTabBg){
            v = "#ffffff";
          } else if((p === "fill" || p === "stroke") && pdfIsLight(v)){
            const c = pdfParseColor(v);
            if(c && c.a < 1) v = "rgba(26, 26, 26, " + c.a + ")";
            else v = "#1a1a1a";
          }
          css += p + ":" + v + ";";
        }
        if(cs.getPropertyValue("display") === "none") css += "display:none;";
        d.setAttribute("style", css);
        d.removeAttribute("class");
      }
      const ph = clone.querySelector("#playhead");
      if(ph && ph.parentNode) ph.parentNode.removeChild(ph);
      const pxW = Math.max(1, Math.round(w * pxPerUnit));
      const pxH = Math.max(1, Math.round(h * pxPerUnit));
      clone.setAttribute("xmlns", NS);
      clone.setAttribute("viewBox", x0 + " 0 " + w + " " + h);
      clone.setAttribute("width", pxW);
      clone.setAttribute("height", pxH);
      const xml = new XMLSerializer().serializeToString(clone);
      const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement("canvas");
        cv.width = pxW; cv.height = pxH;
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, pxW, pxH);
        ctx.drawImage(img, 0, 0, pxW, pxH);
        resolve(cv);
      };
      img.onerror = () => reject(new Error("SVG rasterisation failed"));
      img.src = url;
    }catch(e){ reject(e); }
  });
}

let pdfBusy = false;

async function exportPDF(){
  if(pdfBusy) return;
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert("PDF engine (jsPDF) could not be loaded.\nCheck your internet connection and reload the page.");
    return;
  }
  pdfBusy = true;
  const btn = $("btnPdfYellow");
  const oldHTML = btn ? btn.innerHTML : "";
  if(btn){ btn.disabled = true; btn.innerHTML = "⏳ …"; }
  setStatus("Generating PDF…");
  let tempTab = false;
  try{
    stopPlayback(false);
    state.selection = null;
    svgRoot.querySelectorAll(".note-selected,.note-playing").forEach(el => {
      el.classList.remove("note-selected"); el.classList.remove("note-playing");
    });
    const phEl = document.getElementById("playhead");
    if(phEl) phEl.style.display = "none";

    const hasNotes = state.measures.some(m => (m.notes || []).length > 0);
    if(guitarMode() && hasNotes && !state.showTab){
      tempTab = true;
      state.showTab = true;
      render();
    }
    if(document.fonts && document.fonts.ready){
      try { await document.fonts.ready; } catch(e){}
    }
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:"landscape", unit:"mm", format:"a4", compress:true });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 10;
    const contentW = pageW - margin * 2;
    const headerH = 22;
    const PAGE_W = getPageWidth();
    const svgH   = svgHeight();
    const SCALE  = 0.15;
    const rowH   = svgH * SCALE;
    const gap    = 7;
    const maxUnits = contentW / SCALE;
    const availH = pageH - margin * 2 - headerH;
    const rowsPerPage = Math.max(1, Math.floor((availH + gap) / (rowH + gap)));
    const slices = [];
    let x = 0, guard = 0;
    while(x < PAGE_W - 0.5 && guard++ < 800){
      let end = Math.min(PAGE_W, x + maxUnits);
      if(end < PAGE_W - 0.5){
        const k = Math.floor((end - L.BAR_X0) / L.BAR_W);
        const snapped = L.BAR_X0 + Math.max(1, k) * L.BAR_W;
        end = (snapped > x + 1) ? Math.min(PAGE_W, snapped) : Math.min(PAGE_W, x + L.BAR_W);
      }
      slices.push({ x0:x, x1:end });
      x = end;
    }
    if(!slices.length) slices.push({ x0:0, x1:PAGE_W });
    const PX_PER_UNIT = 2;
    let row = 0, needHeader = true;
    for(let i = 0; i < slices.length; i++){
      const s = slices[i];
      const w = s.x1 - s.x0;
      if(w <= 0.5) continue;
      if(row >= rowsPerPage){ pdf.addPage(); row = 0; needHeader = true; }
      if(needHeader){ drawPdfHeader(pdf, margin, pageW, i === 0); needHeader = false; }
      const yTop = margin + headerH + row * (rowH + gap);
      setStatus(`Generating PDF… system ${i + 1}/${slices.length}`);
      const canvas = await pdfRasterizeSlice(s.x0, w, svgH, PX_PER_UNIT);
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", margin, yTop, w * SCALE, rowH);
      row++;
    }
    const fname = scoreBaseName();
    pdf.save(fname + ".pdf");
    setStatus(`✅ PDF ذخیره شد — ${slices.length} سیستم، ${pdf.internal.getNumberOfPages()} صفحه` + (state.showTab ? " · با TAB 🎸" : ""));
  }catch(err){
    console.error(err);
    alert("PDF export failed:\n" + err.message);
    setStatus("PDF export failed");
  }finally{
    if(tempTab){ state.showTab = false; render(); }
    if(btn){ btn.disabled = false; btn.innerHTML = oldHTML; }
    pdfBusy = false;
  }
}

function drawPdfHeader(pdf, margin, pageW, isFirst){
  pdf.setTextColor(20, 20, 20);
  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(18);
  pdf.text(state.title || "Untitled", margin, margin + 9);
  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(9);
  pdf.setTextColor(95, 95, 95);
  const parts = [];
  if(state.composer) parts.push(state.composer);
  parts.push("Tempo " + state.tempo);
  if(state.tempoText) parts.push(state.tempoText);
  parts.push(state.instrument);
  if(state.showTab) parts.push("with TAB");
  pdf.text(parts.join("   |   "), margin, margin + 15);
  if(!isFirst){
    pdf.setFontSize(8);
    pdf.setTextColor(140, 140, 140);
    pdf.text("(continued)", pageW - margin, margin + 9, { align:"right" });
  }
}

  if(!state._layout) return 0;
  let n = 0;
  state._layout.forEach(entries => entries.forEach(e => { if(e.isArp) n++; }));
  return n;
}

    render();

function makeNoteIcon(type, isRest){
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 30 40");
  svg.style.width = "20px"; svg.style.height = "26px";
  const color = "currentColor";
  if(isRest){
    if(type === "whole" || type === "half"){
      svg.appendChild(mk("rect", { x:8, y:type === "whole" ? 16 : 14, width:14, height:5, fill:color }));
    } else if(type === "quarter"){
      svg.appendChild(mk("path", { d:"M12,4 L12,26 Q16,22 18,26 L18,8 Q14,12 12,8 Z", fill:color }));
    } else {
      const n = type === "eighth" ? 1 : (type === "sixteenth" ? 2 : 3);
      for(let i=0;i<n;i++){
        const cx = 12 + i*5;
        svg.appendChild(mk("circle", { cx:cx, cy:18+i*4, r:2.6, fill:color }));
        svg.appendChild(mk("path", { d:`M${cx+1},${18+i*4-2} Q${cx+8},${10+i*3} ${cx+3},${5+i*2}`,
          stroke:color, "stroke-width":1.6, fill:"none" }));
      }
    }
    return svg;
  }
  const head = mk("ellipse", { cx:10, cy:30, rx:6, ry:4.4, transform:"rotate(-20 10 30)" });
  const stem = mk("line", { x1:15.5, y1:30, x2:15.5, y2:6, stroke:color, "stroke-width":1.6 });
  if(type === "whole"){
    head.setAttribute("fill","none"); head.setAttribute("stroke",color); head.setAttribute("stroke-width","1.6");
    svg.appendChild(head); return svg;
  }
  if(type === "half"){
    head.setAttribute("fill","none"); head.setAttribute("stroke",color); head.setAttribute("stroke-width","1.6");
    svg.appendChild(head); svg.appendChild(stem); return svg;
  }
  head.setAttribute("fill",color);
  svg.appendChild(head); svg.appendChild(stem);
  const flags = type === "eighth" ? 1 : (type === "sixteenth" ? 2 : (type === "thirtysecond" ? 3 : 0));
  for(let i=0;i<flags;i++){
    const y = 6 + i*6;
    svg.appendChild(mk("path", { d:`M15.5,${y} Q23,${y+2} 21,${y+10} Q19,${y+4} 15.5,${y+5} Z`, fill:color }));
  }
  return svg;
}

  [48,52,55,60],[43,47,50,55],[45,48,52,57],[41,45,48,53],

function loadArpDemo(){
  stopPlayback(false);
  pushUndo();
  state.measures = ARP_DEMO.map((chord, i) => ({
    number: i + 1, divisions: DIV,
    time: { beats:4, beatType:4 }, key: 0, clef: "treble",
    repeatStart: false, repeatEnd: false,
    notes: chord.map(midi => {
      const p = midiToPitch(midi);
      return { step:p.step, octave:p.octave, alter:p.alter, start:0, duration: DIV*4, rest:false };
    })
  }));
  state.title = "Arpeggio Study";
  state.tempo = 90; state.tempoText = "Andante";
  state.selection = null; state.activeMi = 0;
  state.arpeggio = true;
  if(guitarMode()) state.showTab = true;
  render();
  viewport.scrollLeft = 0;
  setStatus(`Arpeggio demo — ${countArpeggioNotes()} notes. Press ▶`);
}

function loadRepeatDemo(){
  stopPlayback(false);
  pushUndo();
  const seq = [
    [ {p:["C",5],d:4}, {p:["D",5],d:4}, {p:["E",5],d:8} ],
    [ {p:["E",5],d:4}, {p:["D",5],d:4}, {p:["C",5],d:8} ],
    [ {p:["E",5],d:4}, {p:["F",5],d:4}, {p:["G",5],d:8} ],
    [ {p:["G",5],d:4}, {p:["F",5],d:4}, {p:["E",5],d:8} ],
    [ {p:["C",5],d:4}, {p:["C",5],d:4}, {p:["G",4],d:8} ],
    [ {p:["A",4],d:4}, {p:["A",4],d:4}, {p:["G",4],d:8} ]
  ];
  state.measures = seq.map((notes, i) => {
    const m = makeMeasure(i + 1);
    let cursor = 0;
    notes.forEach(nn => {
      m.notes.push({
        step: nn.p[0], octave: nn.p[1], alter: 0,
        start: cursor, duration: nn.d, rest: false, dotted:false, tuplet:0, dynamic:""
      });
      cursor += nn.d;
    });
    return m;
  });
  state.measures[0].repeatStart = true;
  state.measures[3].repeatEnd   = true;
  state.title = "Repeat Demo (A–B–A–B)";
  state.tempo = 110; state.tempoText = "Moderato";
  state.selection = null; state.activeMi = 0;
  render();
  viewport.scrollLeft = 0;
  const order = getPlaybackOrder();
  setStatus(`Repeat demo — order: ${order.map(i=>i+1).join("→")} (▶)`);
}

   ============================================================ */
(function(){
  const track = $("toolbarTrack"), vp = $("toolbarViewport");
  let offset = 0;
  function update(){
    const maxOffset = Math.max(0, track.scrollWidth - vp.clientWidth);
    offset = clamp(offset, 0, maxOffset);
    track.style.transform = `translateX(${-offset}px)`;
    $("scrollPrev").disabled = offset <= 0;
    $("scrollNext").disabled = offset >= maxOffset;
  }
  $("scrollPrev").onclick = () => { offset -= 220; update(); };
  $("scrollNext").onclick = () => { offset += 220; update(); };
  window.addEventListener("resize", update);
  setTimeout(update, 40);
  update();
})();

  if(!choice) return;
  const c = choice.trim().toLowerCase();
  if(c === "open") $("fileInput").click();
  else if(c === "importmidi") $("midiInput").click();
  else if(c === "exportmidi") exportMidi();
  else if(c === "savexml" || c === "export") exportMusicXML();
  else if(c === "pdf") exportPDF();
  else if(c === "print") window.print();
  else if(c === "new"){ if(confirm("New score?")){ pushUndo(); state.measures=[makeMeasure(1)]; state.selection=null; render(); } }
  else if(c === "undo") undo();
  else if(c === "redo") redo();
  else if(c === "addbars"){ pushUndo(); for(let i=0;i<4;i++){ const prev=state.measures[state.measures.length-1]; state.measures.push(makeMeasure(state.measures.length+1, prev)); } render(); }
  else if(c === "tab"){ state.showTab = !state.showTab; syncArpUI(); render(); }
  else if(c === "arp"){ state.arpeggio = !state.arpeggio; render(); }
  else if(c === "guitar"){ state.instrument="Nylon Guitar"; state.showTab=true; state.arpeggio=true; render(); }

document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;

  if(e.code === "Space"){ e.preventDefault(); togglePlay(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === "y"){ e.preventDefault(); redo(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === "s"){ e.preventDefault(); exportMusicXML(); return; }
  if(e.ctrlKey && e.key.toLowerCase() === "o"){ e.preventDefault(); $("fileInput").click(); return; }
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "e"){ e.preventDefault(); exportPDF(); return; }
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "m"){ e.preventDefault(); exportMidi(); return; }
  if(e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i"){ e.preventDefault(); $("midiInput").click(); return; }

  if(e.key.toLowerCase() === "t" && !e.ctrlKey && !e.metaKey){ e.preventDefault(); state.showTab = !state.showTab; syncArpUI(); render(); return; }
  if(e.key.toLowerCase() === "a" && !e.ctrlKey && !e.metaKey){ e.preventDefault(); state.arpeggio = !state.arpeggio; render(); return; }
  if(e.key.toLowerCase() === "m" && !e.ctrlKey && !e.metaKey){ e.preventDefault(); $("micPanel").classList.toggle("open"); return; }
  if(e.key === "[" ){ e.preventDefault(); toggleRepeatStart(); return; }
  if(e.key === "]" ){ e.preventDefault(); toggleRepeatEnd(); return; }
  if(e.key.toLowerCase() === "r" && !e.ctrlKey && !e.metaKey){ e.preventDefault(); $("rowRests").children[2].click(); return; }

  if(!state.selection) return;
  const { mi, ni } = state.selection;
  const note = state.measures[mi]?.notes[ni];
  if(!note) return;
  if(e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); deleteNote(mi, ni); return; }
  if(e.key === "ArrowUp" || e.key === "ArrowDown"){
    if(note.rest) return;
    e.preventDefault(); pushUndo();
    let d = pitchToDia(note.step, note.octave);
    d = clamp(d + (e.key === "ArrowUp" ? 1 : -1), 14, 56);
    const p = diaToPitch(d);
    note.step = p.step; note.octave = p.octave;
    if(state.previewSound) playPreview(pitchToMidi(note.step, note.octave, note.alter || 0));
    render();
    return;
  }
  if(e.key === "ArrowLeft" || e.key === "ArrowRight"){
    e.preventDefault(); pushUndo();
    const mDur = measureDuration(state.measures[mi]);
    const div = state.measures[mi].divisions || DIV;
    note.start = clamp((note.start||0) + (e.key === "ArrowRight" ? div : -div),
                       0, Math.max(0, mDur - (note.duration || div)));
    state.measures[mi].notes.sort((a,b) => (a.start||0) - (b.start||0));
    state.selection = null; render();
  }
});

let dragCount = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); dragCount++; if(dragCount === 1) $("dropOverlay").classList.add("active"); });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("dragleave", e => { e.preventDefault(); dragCount--; if(dragCount <= 0){ dragCount = 0; $("dropOverlay").classList.remove("active"); } });
document.addEventListener("drop", async e => {
  e.preventDefault(); dragCount = 0; $("dropOverlay").classList.remove("active");
  const f = e.dataTransfer?.files?.[0]; if(!f) return;
  try {
    if(/\.(mid|midi)$/i.test(f.name)) await importMidiFile(f);
    else await importFile(f);
  } catch(err){ alert("Import failed:\n" + err.message); }
});

document.body.addEventListener("pointerdown", () => {
  initAudio();
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}, {once:true});

/* ============================================================
   BOOT
   ============================================================ */
buildToolbar();
state.measures = [makeMeasure(1)];
render();
showEnvWarning();

if(location.protocol === "file:"){
  setStatus("⚠️ file:// — ذخیره به‌صورت دانلود انجام می‌شود. برای پوشه xml از http://localhost استفاده کنید");
} else {
  setStatus("Ready — 🎤 Mic · 📁 XML · 🎹 MIDI I/O · ▶ Play");
}
</script>
</body>
</html>
