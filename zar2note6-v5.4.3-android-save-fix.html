<script>
/* ============================================================
   MAESTRO + MIC STUDIO v5.4.3
   - Save As dialog: FILENAME + LOCATION
   - Import/Export MIDI (.mid / .midi) with extension fix
   - Mic recording with REST/silence insertion
   - Smooth continuous auto-scroll during playback
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";
const DIV = 8;
const DUR = { whole:32, half:16, quarter:8, eighth:4, sixteenth:2, thirtysecond:1 };
const STEP_SEMI = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const STEP_IDX  = { C:0, D:1, E:2, F:3, G:4, A:5, B:6 };
const STEPS     = ["C","D","E","F","G","A","B"];
const CLEF_BOTTOM = { treble: 30, bass: 18, alto: 21, tenor: 26 };
const TUNING = [40,45,50,55,59,64];
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const A4 = 440;

const ARP_PATTERNS = {
  PIMA:   [0,1,2,3],
  PAMI:   [0,3,2,1],
  PIMAMI: [0,1,2,3,2,1],
  PAMAMI: [0,3,2,3,2,1]
};
const ARP_FINGERS = {
  PIMA:   ["p","i","m","a"],
  PAMI:   ["p","a","m","i"],
  PIMAMI: ["p","i","m","a","m","i"],
  PAMAMI: ["p","a","m","a","m","i"]
};
const FINGER_CLASS     = { p:"finger-p",     i:"finger-i",     m:"finger-m",     a:"finger-a" };
const FINGER_ARP_CLASS = { p:"arp-fp",       i:"arp-fi",       m:"arp-fm",       a:"arp-fa" };
const FINGER_TAB_CLASS = { p:"tab-fp",       i:"tab-fi",       m:"tab-fm",       a:"tab-fa" };

const L = { MARGIN_L:44, MARGIN_R:44, HEADER_W:110, BAR_W:260,
  STAFF_TOP:90, STAFF_STEP:12, STAFF_H:48,
  SVG_H:240, SVG_H_TAB:316,
  TAB_TOP:200, TAB_STEP:12, TAB_H:60, MIN_W:1200 };
L.BAR_X0 = L.MARGIN_L + L.HEADER_W;

const state = {
  title:"My Music", composer:"", tempo:120, tempoText:"Allegretto",
  instrument:"Acoustic Grand Piano", measures:[],
  current:{ duration:DUR.quarter, dotted:false, rest:false, accidental:0,
    tuplet:0, dynamic:"", clef:"treble" },
  selection:null, zoom:1, undo:[], redo:[], drag:null, suppressClick:0,
  userScrollUntil: 0, previewSound: true,
  showTab:false, arpeggio:false, arpPattern:"PIMA",
  activeMi: 0,
  micActiveMi: 0,
  micListening: false,
  _layout: null
};

const $ = id => document.getElementById(id);
const svgRoot = $("score");
const viewport = $("scoreViewport");

let btnTab = null, btnArp = null, arpSelect = null;
let btnRepeatStart = null, btnRepeatEnd = null;

function mk(tag, attrs){
  const e = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function mkText(x, y, txt, attrs){
  const t = mk("text", Object.assign({ x, y }, attrs || {}));
  t.textContent = txt;
  return t;
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function setStatus(t){ $("statusMsg").textContent = t; }
function guitarMode(){ return /guitar/i.test(state.instrument); }
function isSecureCtx(){ return window.isSecureContext && location.protocol !== "file:"; }

function systemBottom(){ return state.showTab ? L.TAB_TOP + L.TAB_H : L.STAFF_TOP + L.STAFF_H; }
function svgHeight(){ return state.showTab ? L.SVG_H_TAB : L.SVG_H; }
function tabYForString(s){ return L.TAB_TOP + (5 - s) * L.TAB_STEP; }

/* ============================================================
   ENV WARNING BANNER
   ============================================================ */
function showEnvWarning(){
  const w = $("envWarning");
  if(location.protocol === "file:"){
    w.classList.add("show");
    w.innerHTML =
      '⚠️ شما این فایل را با <code>file://</code> باز کرده‌اید. ' +
      'میکروفون و ذخیره در پوشه کار نمی‌کنند. ' +
      'برای فعال شدن، یک سرور محلی اجرا کنید: ' +
      '<b>python -m http.server 8000</b> ' +
      'و از <b>http://localhost:8000/</b> باز کنید. ' +
      'فعلاً فایل‌ها به‌جای پوشه، دانلود می‌شوند.';
    return;
  }
  if(!window.showSaveFilePicker && !window.showDirectoryPicker){
    w.classList.add("show");
    w.innerHTML =
      '⚠️ مرورگر شما از دیالوگ ذخیره‌ی بومی پشتیبانی نمی‌کند. ' +
      'نام فایل را می‌پرسیم و فایل دانلود می‌شود. ' +
      'برای ذخیره در محل دلخواه از <b>Chrome / Edge / Opera دسکتاپ</b> استفاده کنید.';
    return;
  }
}

/* ---------- UNDO ---------- */
function updateUndoButtons(){
  const u = $("btnUndo"), r = $("btnRedo");
  if(u) u.disabled = state.undo.length === 0;
  if(r) r.disabled = state.redo.length === 0;
}
function pushUndo(){
  state.undo.push(JSON.stringify(state.measures));
  if(state.undo.length > 100) state.undo.shift();
  state.redo = [];
  updateUndoButtons();
}
function undo(){
  if(!state.undo.length){ setStatus("Nothing to undo"); return; }
  state.redo.push(JSON.stringify(state.measures));
  state.measures = JSON.parse(state.undo.pop());
  state.selection = null;
  updateUndoButtons(); render();
  setStatus(`Undo`);
}
function redo(){
  if(!state.redo.length){ setStatus("Nothing to redo"); return; }
  state.undo.push(JSON.stringify(state.measures));
  state.measures = JSON.parse(state.redo.pop());
  state.selection = null;
  updateUndoButtons(); render();
  setStatus("Redo");
}

/* ---------- pitch helpers ---------- */
function pitchToMidi(step, octave, alter){ return (octave+1)*12 + STEP_SEMI[step] + (alter||0); }
function pitchToDia(step, octave){ return octave*7 + STEP_IDX[step]; }
function diaToPitch(d){
  const octave = Math.floor(d/7);
  const idx = ((d%7)+7)%7;
  return { step: STEPS[idx], octave };
}
function midiToPitch(midi){
  const map = [["C",0],["C",1],["D",0],["D",1],["E",0],["F",0],["F",1],["G",0],["G",1],["A",0],["A",1],["B",0]];
  const pc = ((midi%12)+12)%12;
  const [step, alter] = map[pc];
  return { step, alter, octave: Math.floor(midi/12)-1 };
}
function midiName(midi){
  const p = midiToPitch(midi);
  const a = p.alter === 1 ? "♯" : p.alter === -1 ? "♭" : "";
  return p.step + a + p.octave;
}
function freqToMidi(f){ return Math.round(69 + 12 * Math.log2(f / A4)); }
function midiToFreq(m){ return A4 * Math.pow(2, (m - 69) / 12); }
function centsOff(f, m){
  const exact = midiToFreq(m);
  return Math.round(1200 * Math.log2(f / exact));
}
function makeMeasure(number, prev){
  return { number, divisions: DIV,
    time: prev ? { ...prev.time } : { beats:4, beatType:4 },
    key:  prev ? prev.key : 0,
    clef: prev ? prev.clef : "treble",
    repeatStart: false,
    repeatEnd:   false,
    notes: [] };
}
function measureDuration(m){ return m.time.beats * (4 / m.time.beatType) * DIV; }

/* ---------- geometry ---------- */
function getPageWidth(){
  const count = state.measures.length + 1;
  return Math.max(L.MIN_W, L.BAR_X0 + count * L.BAR_W + L.MARGIN_R);
}
function barGeom(mi){
  return { sys:0, col:mi,
    x0: L.BAR_X0 + mi * L.BAR_W,
    x1: L.BAR_X0 + (mi + 1) * L.BAR_W };
}
function startToX(mi, start){
  const m = state.measures[mi]; if(!m) return 0;
  const mDur = measureDuration(m);
  const { x0, x1 } = barGeom(mi);
  const inner0 = x0 + 18, inner1 = x1 - 24;
  return inner0 + ((start||0) / mDur) * (inner1 - inner0);
}
function xToStart(mi, x){
  const m = state.measures[mi]; if(!m) return 0;
  const mDur = measureDuration(m);
  const div = m.divisions || DIV;
  const { x0, x1 } = barGeom(mi);
  const inner0 = x0 + 18, inner1 = x1 - 24;
  const rel = clamp((x - inner0) / (inner1 - inner0), 0, 0.9999);
  let s = Math.round(rel * mDur / div) * div;
  return clamp(s, 0, Math.max(0, mDur - div));
}
function diatonicY(dia){
  const botY = L.STAFF_TOP + L.STAFF_H;
  const clef = state.measures[0]?.clef || "treble";
  const bottomDia = CLEF_BOTTOM[clef];
  return botY - (dia - bottomDia) * (L.STAFF_STEP / 2);
}
function yToDiatonic(y){
  const botY = L.STAFF_TOP + L.STAFF_H;
  const clef = state.measures[0]?.clef || "treble";
  const bottomDia = CLEF_BOTTOM[clef];
  return Math.round(bottomDia + (botY - y) / (L.STAFF_STEP / 2));
}
function assignString(midi, used){
  let best = null;
  for(let i=0;i<6;i++){
    const fret = midi - TUNING[i];
    if(fret < 0 || fret > 16) continue;
    if(used && used.has(i)) continue;
    const score = fret * 10 + i;
    if(!best || score < best.score) best = { i, fret, score };
  }
  return best;
}

/* ============================================================
   VISUAL LAYOUT
   ============================================================ */
function buildVisualLayout(){
  const layout = [];
  state.measures.forEach((m, mi) => {
    const entries = [];
    const groups = new Map();
    (m.notes||[]).forEach((n, ni) => {
      if(n.rest){
        entries.push({ mi, ni, note: n, start: n.start || 0, isArp: false, finger: "", tab: null, id:`m${mi}_e${ni}` });
        return;
      }
      const key = n.start || 0;
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push({ n, ni });
    });
    groups.forEach((arr, start) => {
      arr.sort((a,b) =>
        pitchToMidi(a.n.step, a.n.octave, a.n.alter||0) -
        pitchToMidi(b.n.step, b.n.octave, b.n.alter||0));
      const used = new Set();
      const tabMap = new Map();
      arr.forEach(a => {
        const midi = pitchToMidi(a.n.step, a.n.octave, a.n.alter||0);
        const pos = assignString(midi, used);
        if(pos){ used.add(pos.i); tabMap.set(a.ni, {s: pos.i, fret: pos.fret}); }
        else tabMap.set(a.ni, null);
      });
      if(state.arpeggio && arr.length >= 2){
        const pattern = ARP_PATTERNS[state.arpPattern] || ARP_PATTERNS.PIMA;
        const fingers = ARP_FINGERS[state.arpPattern] || ARP_FINGERS.PIMA;
        const origDur = arr[0].n.duration || DIV;
        const stepDur = origDur / pattern.length;
        pattern.forEach((idx, k) => {
          const t = arr[Math.min(idx, arr.length - 1)];
          entries.push({
            mi, ni: t.ni, note: t.n,
            start: start + k * stepDur,
            isArp: true, finger: fingers[k], arpIdx: k, arpPatternIdx: idx,
            stepDur, tab: tabMap.get(t.ni),
            id: `m${mi}_e${t.ni}_a${k}`
          });
        });
      } else {
        arr.forEach(a => {
          entries.push({
            mi, ni: a.ni, note: a.n,
            start: a.n.start || 0,
            isArp: false, finger: "", tab: tabMap.get(a.ni),
            id: `m${mi}_e${a.ni}`
          });
        });
      }
    });
    entries.sort((a,b) => a.start - b.start);
    layout.push(entries);
  });
  return layout;
}

/* ============================================================
   REPEAT LOGIC
   ============================================================ */
function hasAnyRepeat(){ return state.measures.some(m => m.repeatStart || m.repeatEnd); }
function findMatchingStart(endIdx){
  for(let j = endIdx; j >= 0; j--) if(state.measures[j].repeatStart) return j;
  return -1;
}
function getPlaybackOrder(){
  const measures = state.measures;
  const order = [];
  const alreadyRepeated = new Set();
  let i = 0, safety = 0;
  while(i < measures.length && safety++ < 5000){
    const m = measures[i];
    order.push(i);
    if(m.repeatEnd){
      const startIdx = findMatchingStart(i);
      if(startIdx >= 0 && !alreadyRepeated.has(startIdx)){
        alreadyRepeated.add(startIdx);
        i = startIdx;
        continue;
      }
    }
    i++;
  }
  return order;
}
function toggleRepeatStart(){
  const mi = state.activeMi;
  if(mi < 0 || mi >= state.measures.length) return;
  pushUndo();
  const m = state.measures[mi];
  m.repeatStart = !m.repeatStart;
  render();
  setStatus(m.repeatStart ? `▼ Repeat START at measure ${mi+1}` : `Repeat start cleared at m.${mi+1}`);
}
function toggleRepeatEnd(){
  const mi = state.activeMi;
  if(mi < 0 || mi >= state.measures.length) return;
  pushUndo();
  const m = state.measures[mi];
  m.repeatEnd = !m.repeatEnd;
  render();
  setStatus(m.repeatEnd ? `▲ Repeat END at measure ${mi+1}` : `Repeat end cleared at m.${mi+1}`);
}
function clearAllRepeats(){
  if(!hasAnyRepeat()){ setStatus("No repeat signs to clear"); return; }
  pushUndo();
  state.measures.forEach(m => { m.repeatStart = false; m.repeatEnd = false; });
  render();
  setStatus("All repeat signs cleared");
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  stopPlayback(false);
  state._layout = buildVisualLayout();

  const PAGE_W = getPageWidth();
  const svgH = svgHeight();
  svgRoot.setAttribute("viewBox", `0 0 ${PAGE_W} ${svgH}`);
  svgRoot.setAttribute("width",  PAGE_W * state.zoom);
  svgRoot.setAttribute("height", svgH * state.zoom);
  svgRoot.style.width  = (PAGE_W * state.zoom) + "px";
  svgRoot.style.height = (svgH * state.zoom) + "px";
  svgRoot.innerHTML = "";

  drawStaff(PAGE_W);
  for(let mi=0; mi<state.measures.length; mi++) drawRealBar(mi);
  drawGhostBar(state.measures.length);

  const ph = mk("line", { class:"playhead", x1:0,y1:0,x2:0,y2:0 });
  ph.style.display = "none";
  ph.id = "playhead";
  svgRoot.appendChild(ph);

  updateTitleTempo();
  updateUndoButtons();
  syncArpUI();
}

function updateTitleTempo(){
  $("scoreTitle").value = state.title;
  $("scoreComposer").value = state.composer;
  $("tempoInput").value = state.tempo;
  $("tempoText").value = state.tempoText;
  $("instText").textContent = state.instrument;
  if($("instrumentSel")) $("instrumentSel").value = state.instrument;
}

function drawStaff(PAGE_W){
  const sTop = L.STAFF_TOP, sBot = sTop + L.STAFF_H;
  for(let i=0; i<5; i++){
    const y = sTop + i * L.STAFF_STEP;
    svgRoot.appendChild(mk("line", { class:"staff-line", x1: L.MARGIN_L, y1: y, x2: PAGE_W - L.MARGIN_R, y2: y }));
  }
  svgRoot.appendChild(mk("line", { class:"bar-line", x1: L.MARGIN_L, y1: sTop, x2: L.MARGIN_L, y2: sBot }));

  const firstM = state.measures[0];
  const clef = firstM?.clef || "treble";
  const clefGlyph = clef === "treble" ? "𝄞" : clef === "bass" ? "𝄢" : "𝄡";
  svgRoot.appendChild(mkText(L.MARGIN_L + 24, sBot - 8, clefGlyph,
    { class:"clef", "font-size": clef === "treble" ? 52 : 44, "text-anchor":"middle" }));

  drawKeySig(L.MARGIN_L + 48, sTop, firstM?.key || 0);

  const time = firstM?.time || { beats:4, beatType:4 };
  svgRoot.appendChild(mkText(L.MARGIN_L + 92, sTop + 20, String(time.beats), { class:"time-sig", "font-size":19, "text-anchor":"middle" }));
  svgRoot.appendChild(mkText(L.MARGIN_L + 92, sTop + 42, String(time.beatType), { class:"time-sig", "font-size":19, "text-anchor":"middle" }));

  if(state.showTab){
    const tTop = L.TAB_TOP, tBot = tTop + L.TAB_H;
    for(let i=0; i<6; i++){
      const y = tTop + i * L.TAB_STEP;
      svgRoot.appendChild(mk("line", { class:"tab-line", x1: L.MARGIN_L, y1: y, x2: PAGE_W - L.MARGIN_R, y2: y }));
    }
    svgRoot.appendChild(mk("line", { class:"bar-line", x1: L.MARGIN_L, y1: sBot, x2: L.MARGIN_L, y2: tTop }));
    svgRoot.appendChild(mk("line", { class:"bar-line", x1: L.MARGIN_L, y1: tTop, x2: L.MARGIN_L, y2: tBot }));
    svgRoot.appendChild(mkText(L.MARGIN_L + 22, tTop + L.TAB_H/2 + 5, "TAB", { class:"tab-clef", "text-anchor":"middle" }));
    const names = ["E","A","D","G","B","E"];
    for(let i=0;i<6;i++){
      svgRoot.appendChild(mkText(PAGE_W - L.MARGIN_R + 8, tabYForString(5-i) + 3, names[i], { class:"tab-string-label" }));
    }
  }
}

function drawKeySig(x, sTop, fifths){
  if(!fifths) return;
  const sharpPos = [34,31,35,32,29,33,30];
  const flatPos  = [30,33,29,32,28,31,27];
  const count = Math.min(Math.abs(fifths), 7);
  const positions = fifths > 0 ? sharpPos : flatPos;
  const glyph = fifths > 0 ? "♯" : "♭";
  for(let i=0; i<count; i++){
    const y = diatonicY(positions[i]) + 6;
    svgRoot.appendChild(mkText(x + i*13, y, glyph, { class:"note-acc", "font-size":20 }));
  }
}

function drawRepeatStartBar(x, y0, y1){
  svgRoot.appendChild(mk("line", { class:"repeat-line", x1:x, y1:y0, x2:x, y2:y1 }));
  svgRoot.appendChild(mk("line", { class:"repeat-line-thin", x1:x+7, y1:y0, x2:x+7, y2:y1 }));
  const sTop = L.STAFF_TOP;
  const cy1 = sTop + L.STAFF_STEP * 1.55;
  const cy2 = sTop + L.STAFF_STEP * 2.55;
  svgRoot.appendChild(mk("circle", { class:"repeat-dot", cx:x+14, cy:cy1, r:2.7 }));
  svgRoot.appendChild(mk("circle", { class:"repeat-dot", cx:x+14, cy:cy2, r:2.7 }));
  svgRoot.appendChild(mkText(x+4, y0 - 10, "▼", { class:"repeat-marker", "text-anchor":"middle" }));
}
function drawRepeatEndBar(x, y0, y1){
  const sTop = L.STAFF_TOP;
  const cy1 = sTop + L.STAFF_STEP * 1.55;
  const cy2 = sTop + L.STAFF_STEP * 2.55;
  svgRoot.appendChild(mk("circle", { class:"repeat-dot", cx:x-14, cy:cy1, r:2.7 }));
  svgRoot.appendChild(mk("circle", { class:"repeat-dot", cx:x-14, cy:cy2, r:2.7 }));
  svgRoot.appendChild(mk("line", { class:"repeat-line-thin", x1:x-7, y1:y0, x2:x-7, y2:y1 }));
  svgRoot.appendChild(mk("line", { class:"repeat-line", x1:x, y1:y0, x2:x, y2:y1 }));
  svgRoot.appendChild(mkText(x-4, y0 - 10, "▲", { class:"repeat-marker", "text-anchor":"middle" }));
}

function drawRealBar(mi){
  const m = state.measures[mi];
  const { x0, x1 } = barGeom(mi);
  const sTop = L.STAFF_TOP, sBot = sTop + L.STAFF_H;
  const y0 = sTop, y1 = systemBottom();

  const numEl = mkText(x0 + 6, sTop - 8, String(mi+1), {
    class:"measure-num" + (mi === state.activeMi ? " selected" : "") +
          ((m.repeatStart || m.repeatEnd) ? " has-repeat" : "")
  });
  numEl.style.pointerEvents = "all";
  numEl.addEventListener("click", ev => {
    ev.stopPropagation();
    state.activeMi = mi;
    render();
    setStatus(`Measure ${mi+1} selected`);
  });
  svgRoot.appendChild(numEl);

  if(m.repeatStart) drawRepeatStartBar(x0, y0, y1);

  const isLast = (mi === state.measures.length - 1);
  if(m.repeatEnd){
    drawRepeatEndBar(x1, y0, y1);
  } else if(isLast){
    svgRoot.appendChild(mk("line", { class:"bar-line thick", x1:x1-5, y1:y0, x2:x1-5, y2:y1 }));
    svgRoot.appendChild(mk("line", { class:"bar-line thick", x1:x1,   y1:y0, x2:x1,   y2:y1 }));
  } else {
    svgRoot.appendChild(mk("line", { class:"bar-line", x1:x1, y1:y0, x2:x1, y2:y1 }));
  }

  const mDur = measureDuration(m);
  let maxEnd = 0;
  (m.notes||[]).forEach(n => { maxEnd = Math.max(maxEnd, (n.start||0) + (n.duration||0)); });
  if(maxEnd > mDur){
    svgRoot.appendChild(mkText(x0 + L.BAR_W/2, sTop - 30, "NEED BAR LINE",
      { class:"needs-barline", "text-anchor":"middle" }));
  }

  const entries = state._layout?.[mi] || [];
  entries.forEach(entry => {
    const x = startToX(mi, entry.start);
    const g = mk("g", { "data-note-id": entry.id, class:"note-hit" });

    drawNoteEntry(g, x, entry, m);
    if(state.showTab && !entry.note.rest) drawTabEntry(g, x, entry);

    if(state.selection && state.selection.entryId === entry.id)
      g.classList.add("note-selected");

    g.addEventListener("pointerdown", ev => {
      if(ev.button && ev.button !== 0) return;
      ev.stopPropagation();
      state.activeMi = entry.mi;
      if(!entry.isArp) beginDrag(ev, entry.mi, entry.ni, entry.id, g);
    });
    g.addEventListener("click", ev => {
      ev.stopPropagation();
      state.selection = { mi: entry.mi, ni: entry.ni, entryId: entry.id };
      state.activeMi = entry.mi;
      document.querySelectorAll(".note-selected").forEach(e=>e.classList.remove("note-selected"));
      g.classList.add("note-selected");
      if(!entry.note.rest && state.previewSound){
        playPreview(pitchToMidi(entry.note.step, entry.note.octave, entry.note.alter || 0));
      }
    });
    g.addEventListener("dblclick", ev => { ev.stopPropagation(); deleteNote(entry.mi, entry.ni); });
    g.addEventListener("contextmenu", ev => { ev.preventDefault(); ev.stopPropagation(); deleteNote(entry.mi, entry.ni); });

    svgRoot.appendChild(g);
  });
}

function drawGhostBar(mi){
  const { x0, x1 } = barGeom(mi);
  const y0 = L.STAFF_TOP, y1 = systemBottom();
  svgRoot.appendChild(mk("line", { class:"bar-line", x1:x0, y1:y0, x2:x0, y2:y1, "stroke-dasharray":"4 4" }));
  const r = mk("rect", { class:"ghost-measure", x:x0+4, y:y0-4, width:(x1-x0-8), height:(y1-y0)+8, rx:6 });
  r.style.pointerEvents = "all";
  r.style.cursor = "pointer";
  r.addEventListener("click", ev => {
    ev.stopPropagation();
    pushUndo();
    const prev = state.measures[state.measures.length-1];
    state.measures.push(makeMeasure(state.measures.length+1, prev));
    render();
    setStatus("Measure " + state.measures.length + " added");
  });
  svgRoot.appendChild(r);
  svgRoot.appendChild(mkText((x0+x1)/2, L.STAFF_TOP + L.STAFF_H/2 + 10, "+", { class:"ghost-plus" }));
}

function drawNoteEntry(g, x, entry, m){
  const note = entry.note;
  const sTop = L.STAFF_TOP;
  if(note.rest){
    drawRest(g, x, note.duration, sTop);
    g.appendChild(mk("rect", { x:x-14, y:sTop-4, width:28, height:L.STAFF_H+8, fill:"transparent", "pointer-events":"all" }));
    return;
  }
  const isArp = entry.isArp;
  const primary = entry.finger || "p";
  const dia = pitchToDia(note.step, note.octave);
  const y = diatonicY(dia);
  const visualDur = entry.isArp ? entry.stepDur : note.duration;
  const q = visualDur / DIV;
  const isWhole = q >= 4;
  const isHalf  = q >= 2 && q < 4;
  const open    = isWhole || isHalf;
  const hasStem = !isWhole;
  const nFlags  = (q < 0.25) ? 3 : (q < 0.5 ? 2 : (q < 1 ? 1 : 0));
  const midY = sTop + 2*L.STAFF_STEP;
  const stemDown = y < midY;
  const stemX = stemDown ? x - 6.5 : x + 6.5;
  const stemY2 = stemDown ? y + 34 : y - 34;

  if(isArp) g.appendChild(mk("circle", { cx:x, cy:y, r: 12, class:"note-halo" }));

  const bottomDia = CLEF_BOTTOM[m.clef || "treble"];
  if(dia > bottomDia + 4){
    const top = bottomDia + 4;
    for(let d = top+2; d <= dia; d += 2){
      const ly = diatonicY(d);
      g.appendChild(mk("line", { class:"ledger", x1:x-11, y1:ly, x2:x+11, y2:ly }));
    }
  } else if(dia < bottomDia){
    for(let d = bottomDia-2; d >= dia; d -= 2){
      const ly = diatonicY(d);
      g.appendChild(mk("line", { class:"ledger", x1:x-11, y1:ly, x2:x+11, y2:ly }));
    }
  }
  if(note.alter === 1)  g.appendChild(mkText(x-18, y+6, "♯", { class:"note-acc" }));
  if(note.alter === -1) g.appendChild(mkText(x-18, y+6, "♭", { class:"note-acc" }));
  if(note.alter === 2)  g.appendChild(mkText(x-22, y+6, "♯♯", { class:"note-acc","font-size":16 }));
  if(note.alter === -2) g.appendChild(mkText(x-22, y+6, "♭♭", { class:"note-acc","font-size":16 }));

  g.appendChild(mk("ellipse", {
    class: "note-head" + (open ? " open" : ""),
    cx:x, cy:y, rx: isWhole ? 8.5 : 7, ry: isWhole ? 6 : 5,
    transform: `rotate(-18 ${x} ${y})`
  }));
  if(hasStem){
    g.appendChild(mk("line", { class:"note-stem", x1: stemX, y1: y, x2: stemX, y2: stemY2 }));
    const dir = stemDown ? 1 : -1;
    for(let i=0;i<nFlags;i++){
      const fy = stemY2 + i * 10 * (-dir);
      g.appendChild(mk("path", { class: "note-flag",
        d: `M ${stemX} ${fy} q 10 ${dir*2}, 7 ${dir*14} q -3 ${-dir*8}, -7 ${-dir*6} Z` }));
    }
  }
  if(note.dotted) g.appendChild(mk("circle", { cx:x+12, cy:y-1, r:2, fill:"currentColor" }));
  if(note.tuplet) g.appendChild(mkText(x, y-42, String(note.tuplet), { class:"tuplet-num", "text-anchor":"middle" }));
  if(note.dynamic) g.appendChild(mkText(x, sTop + L.STAFF_H + 26, note.dynamic, { class:"dyn-mark", "text-anchor":"middle" }));

  const yTop = Math.min(y, stemY2) - 6;
  const yBot = Math.max(y, stemY2) + 6;
  g.appendChild(mk("rect", { x: x-14, y: yTop, width:28, height:yBot-yTop, fill:"transparent", "pointer-events":"all" }));

  if(isArp){
    g.classList.add("arp-note");
    g.classList.add(FINGER_ARP_CLASS[primary] || "arp-fp");
    g.appendChild(mkText(x, y - (stemDown ? 46 : -30), primary, {
      class: "staff-finger " + (FINGER_CLASS[primary] || ""), "text-anchor": "middle"
    }));
  }
}

function drawTabEntry(g, x, entry){
  if(!entry.tab) return;
  const y = tabYForString(entry.tab.s);
  const isArp = entry.isArp;
  const primary = entry.finger || "p";
  if(isArp){
    const tabCls = FINGER_TAB_CLASS[primary] || "tab-fp";
    g.appendChild(mk("circle", { cx:x, cy:y, r:10, class: "tab-halo " + tabCls }));
    g.appendChild(mkText(x, y + 4.5, String(entry.tab.fret), { class:"tab-num-arp " + tabCls, "text-anchor":"middle" }));
    g.appendChild(mkText(x, y + 18, primary, { class:"tab-finger " + (FINGER_CLASS[primary] || ""), "text-anchor":"middle" }));
  } else {
    g.appendChild(mk("rect", { class:"tab-bg", x:x-9, y:y-8, width:18, height:16, fill:"#1a1a1a" }));
    g.appendChild(mkText(x, y + 4.5, String(entry.tab.fret), { class:"tab-num", "text-anchor":"middle" }));
  }
  g.appendChild(mk("rect", { x:x-14, y:y-8, width:28, height:16, fill:"transparent", "pointer-events":"all" }));
}

function drawRest(g, x, dur, sTop){
  const q = dur / DIV;
  if(q >= 4){
    /* Whole rest: hanging from 4th line */
    g.appendChild(mk("rect", { x:x-7, y:sTop+L.STAFF_STEP-3, width:14, height:6, fill:"#e8e8e8" }));
  } else if(q >= 2){
    /* Half rest: sitting on 3rd line */
    g.appendChild(mk("rect", { x:x-7, y:sTop+L.STAFF_STEP*2-3, width:14, height:6, fill:"#e8e8e8" }));
  } else if(q >= 1){
    /* Quarter rest: zigzag */
    g.appendChild(mk("path", {
      d: `M ${x-3} ${sTop+10} L ${x+3} ${sTop+16} L ${x-3} ${sTop+22} L ${x+4} ${sTop+28} L ${x-5} ${sTop+34} L ${x-1} ${sTop+28} L ${x-6} ${sTop+22} L ${x+1} ${sTop+16} Z`,
      fill:"#e8e8e8" }));
  } else {
    /* Eighth, sixteenth, thirtysecond rests: flags */
    const n = q >= 0.5 ? 1 : (q >= 0.25 ? 2 : 3);
    for(let i=0;i<n;i++){
      const cx = x - 3 + i*5;
      const cy = sTop + 14 + i*5;
      g.appendChild(mk("circle", { cx:cx, cy:cy, r:2.6, fill:"#e8e8e8" }));
      g.appendChild(mk("path", {
        d: `M ${cx+1} ${cy-2} Q ${cx+8} ${cy-9} ${cx+3} ${cy-14}`,
        stroke:"#e8e8e8", "stroke-width":1.8, fill:"none", "stroke-linecap":"round" }));
    }
  }
}

function toSvg(ev){
  const r = svgRoot.getBoundingClientRect();
  const vb = svgRoot.viewBox.baseVal;
  return {
    x: (ev.clientX - r.left) * (vb.width / r.width),
    y: (ev.clientY - r.top)  * (vb.height / r.height)
  };
}

svgRoot.addEventListener("click", ev => {
  if(performance.now() < state.suppressClick) return;
  let t = ev.target;
  while(t && t !== svgRoot){
    if(t.dataset && t.dataset.noteId) return;
    t = t.parentNode;
  }
  const pt = toSvg(ev);
  const sTop = L.STAFF_TOP, sBot = sTop + L.STAFF_H;
  if(pt.y < sTop - 60 || pt.y > sBot + 60) return;

  const relX = pt.x - L.BAR_X0;
  if(relX < 0) return;
  const mi = Math.floor(relX / L.BAR_W);

  pushUndo();
  state.activeMi = mi;

  while(state.measures.length <= mi){
    const prev = state.measures[state.measures.length-1];
    state.measures.push(makeMeasure(state.measures.length+1, prev));
  }

  const m = state.measures[mi];
  const start = xToStart(mi, pt.x);
  const dia = clamp(yToDiatonic(pt.y), 14, 56);
  const { step, octave } = diaToPitch(dia);
  const dur = state.current.duration * (state.current.dotted ? 1.5 : 1);

  m.notes.push({
    step: state.current.rest ? "B" : step,
    octave: state.current.rest ? 4 : octave,
    alter: state.current.rest ? 0 : state.current.accidental,
    start, duration: dur,
    rest: state.current.rest,
    dotted: state.current.dotted,
    tuplet: state.current.tuplet,
    dynamic: state.current.dynamic
  });
  m.notes.sort((a,b) => (a.start||0) - (b.start||0));

  if(!state.current.rest) playPreview(pitchToMidi(step, octave, state.current.accidental));

  render();
  setStatus(state.current.rest ? "Rest added" :
    `Added ${midiName(pitchToMidi(step, octave, state.current.accidental))} in bar ${mi+1}`);
});

function deleteNote(mi, ni){
  if(!state.measures[mi]?.notes[ni]) return;
  pushUndo();
  state.measures[mi].notes.splice(ni, 1);
  state.selection = null;
  render();
  setStatus("Note removed");
}

function beginDrag(ev, mi, ni, id, g){
  const m = state.measures[mi];
  const n = m.notes[ni];
  if(!n) return;
  const r = svgRoot.getBoundingClientRect();
  const vb = svgRoot.viewBox.baseVal;
  const originX = startToX(mi, n.start || 0);
  const originY = n.rest ? (L.STAFF_TOP + 24) : diatonicY(pitchToDia(n.step, n.octave));

  state.drag = {
    mi, ni, id, g,
    startX: ev.clientX, startY: ev.clientY,
    sx: vb.width / r.width, sy: vb.height / r.height,
    originX, originY, moved:false, pushed:false, isRest: !!n.rest,
    newStep: n.step, newOctave: n.octave,
    newStart: n.start || 0, targetMi: mi, pid: ev.pointerId,
    lastPreviewStep: n.step, lastPreviewOctave: n.octave
  };
  g.style.cursor = "grabbing";
  window.addEventListener("pointermove", onDragMove);
  window.addEventListener("pointerup", onDragEnd);
  window.addEventListener("pointercancel", onDragEnd);
}

function onDragMove(ev){
  const d = state.drag;
  if(!d || ev.pointerId !== d.pid) return;
  const dxc = ev.clientX - d.startX;
  const dyc = ev.clientY - d.startY;
  if(!d.moved && (Math.abs(dxc) > 4 || Math.abs(dyc) > 4)){
    d.moved = true;
    if(!d.pushed){ pushUndo(); d.pushed = true; }
  }
  if(!d.moved) return;
  const dx = dxc * d.sx;
  const dy = dyc * d.sy;
  d.g.setAttribute("transform", `translate(${dx} ${dy})`);
  if(!d.isRest){
    const newY = d.originY + dy;
    const dia = clamp(yToDiatonic(newY), 14, 56);
    const p = diaToPitch(dia);
    if(state.previewSound && (p.step !== d.lastPreviewStep || p.octave !== d.lastPreviewOctave)){
      playPreview(pitchToMidi(p.step, p.octave, 0), 0.18);
      d.lastPreviewStep = p.step;
      d.lastPreviewOctave = p.octave;
    }
    d.newStep = p.step;
    d.newOctave = p.octave;
  }
  const gx = d.originX + dx;
  let targetMi = Math.floor((gx - L.BAR_X0) / L.BAR_W);
  targetMi = Math.max(0, targetMi);
  while(state.measures.length <= targetMi){
    const prev = state.measures[state.measures.length-1];
    state.measures.push(makeMeasure(state.measures.length+1, prev));
  }
  d.targetMi = targetMi;
  d.newStart = xToStart(targetMi, gx);
  setStatus((d.isRest ? "Rest" : midiName(pitchToMidi(d.newStep, d.newOctave, 0)))
    + " • bar " + (targetMi+1));
}

function onDragEnd(ev){
  const d = state.drag;
  if(!d || ev.pointerId !== d.pid) return;
  window.removeEventListener("pointermove", onDragMove);
  window.removeEventListener("pointerup", onDragEnd);
  window.removeEventListener("pointercancel", onDragEnd);
  state.drag = null;
  if(d.g) d.g.style.cursor = "";
  if(!d.moved) return;
  state.suppressClick = performance.now() + 400;
  const src = state.measures[d.mi].notes;
  const note = src[d.ni];
  if(!note) return;
  if(!d.isRest){ note.step = d.newStep; note.octave = d.newOctave; }
  note.start = d.newStart;
  if(d.targetMi !== d.mi){
    src.splice(d.ni, 1);
    const dest = state.measures[d.targetMi];
    dest.notes.push(note);
    dest.notes.sort((a,b) => (a.start||0) - (b.start||0));
  } else {
    src.sort((a,b) => (a.start||0) - (b.start||0));
  }
  if(!note.rest && state.previewSound) playPreview(pitchToMidi(note.step, note.octave, note.alter || 0));
  state.selection = null;
  render();
}

/* ============================================================
   AUDIO ENGINE
   ============================================================ */
let audioCtx = null, masterGain = null;
let playing = false, animFrame = null, playback = null;

function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.35;
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 12;
  comp.attack.value = 0.003; comp.release.value = 0.25;
  masterGain.connect(comp).connect(audioCtx.destination);
}
function freqOf(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }

function playPreview(midi, dur = 0.45){
  if(!state.previewSound) return;
  try {
    initAudio();
    if(audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime + 0.03;
    synth(freqOf(midi), t, Math.max(0.20, dur), instrumentName());
  } catch(e){}
}

function shapeEnv(gainNode, t, peak, attack, sustainDur, release){
  const a = Math.max(0.008, attack);
  const r = Math.max(0.03, release);
  const tPeak = t + a;
  const tRelease = tPeak + Math.max(0.02, sustainDur);
  const tEnd = tRelease + r;
  gainNode.gain.cancelScheduledValues(t);
  gainNode.gain.setValueAtTime(0, t);
  gainNode.gain.linearRampToValueAtTime(peak, tPeak);
  gainNode.gain.setValueAtTime(peak, tRelease);
  gainNode.gain.linearRampToValueAtTime(0, tEnd);
  return tEnd;
}

function synth(freq, t, dur, instrument){
  dur = Math.max(0.12, dur);
  const stopBuffer = 0.05;
  if(instrument === "guitar"){
    const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
    const g  = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
    o1.type = "triangle"; o2.type = "sawtooth";
    o1.frequency.value = freq; o2.frequency.value = freq; o2.detune.value = 6;
    f.type = "lowpass";
    f.frequency.setValueAtTime(4200, t);
    f.frequency.exponentialRampToValueAtTime(900, t + dur);
    const attack = 0.010, release = 0.10;
    const tEnd = shapeEnv(g, t, 0.15, attack, dur - attack - release, release);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(masterGain);
    o1.start(t); o2.start(t);
    o1.stop(tEnd + stopBuffer); o2.stop(tEnd + stopBuffer);
    return;
  }
  if(instrument === "flute"){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    const attack = 0.06, release = 0.06;
    const tEnd = shapeEnv(g, t, 0.15, attack, dur - attack - release, release);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(tEnd + stopBuffer);
    return;
  }
  if(instrument === "organ"){
    const g = audioCtx.createGain();
    const attack = 0.03, release = 0.05;
    const tEnd = shapeEnv(g, t, 0.12, attack, dur - attack - release, release);
    [1,2,3,4].forEach((mm,i) => {
      const o = audioCtx.createOscillator();
      o.type = "sine"; o.frequency.value = freq * mm;
      const og = audioCtx.createGain();
      og.gain.value = [.7,.25,.12,.06][i];
      o.connect(og); og.connect(g);
      o.start(t); o.stop(tEnd + stopBuffer);
    });
    g.connect(masterGain);
    return;
  }
  if(instrument === "strings"){
    const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
    const g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
    o1.type = "sawtooth"; o2.type = "sine";
    o1.frequency.value = freq; o2.frequency.value = freq;
    f.type = "lowpass"; f.frequency.value = 2200;
    const attack = 0.08, release = 0.10;
    const tEnd = shapeEnv(g, t, 0.10, attack, dur - attack - release, release);
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(masterGain);
    o1.start(t); o2.start(t); o1.stop(tEnd + stopBuffer); o2.stop(tEnd + stopBuffer);
    return;
  }
  const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o1.type = "triangle"; o2.type = "sine";
  o1.frequency.value = freq; o2.frequency.value = freq * 2;
  const attack = 0.008, peak = 0.18;
  const tPeak = t + attack;
  g.gain.cancelScheduledValues(t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, tPeak);
  const decayEnd = Math.max(tPeak + 0.05, t + dur * 0.55);
  g.gain.exponentialRampToValueAtTime(peak * 0.35, decayEnd);
  const tTail = t + Math.max(dur, 0.15);
  g.gain.exponentialRampToValueAtTime(0.0001, tTail);
  g.gain.linearRampToValueAtTime(0, tTail + 0.05);
  o1.connect(g); o2.connect(g); g.connect(masterGain);
  o1.start(t); o2.start(t);
  o1.stop(tTail + 0.10); o2.stop(tTail + 0.10);
}

function instrumentName(){
  const n = state.instrument.toLowerCase();
  if(n.includes("guitar")) return "guitar";
  if(n.includes("flute"))  return "flute";
  if(n.includes("organ"))  return "organ";
  if(n.includes("string") || n.includes("violin")) return "strings";
  return "piano";
}

/* ============================================================
   TIMELINE
   ============================================================ */
function buildTimeline(){
  const items = [];
  const spans = [];
  const order = getPlaybackOrder();
  let pos = 0;
  order.forEach(mi => {
    const m = state.measures[mi];
    if(!m) return;
    const div = m.divisions || DIV;
    const mBeats = m.time.beats * 4 / m.time.beatType;
    spans.push({ mi, startBeat: pos, durBeats: mBeats });
    const entries = state._layout?.[mi] || [];
    entries.forEach(entry => {
      if(entry.note.rest) return;
      const midi = pitchToMidi(entry.note.step, entry.note.octave, entry.note.alter||0);
      const startBeat = pos + entry.start / div;
      let durBeat;
      if(entry.isArp) durBeat = Math.max(0.15, (entry.stepDur * 1.8) / div);
      else durBeat = Math.max(0.10, (entry.note.duration || div) / div);
      items.push({ mi, ni: entry.ni, id: entry.id, midi, rest:false, startBeat, durBeat });
    });
    pos += mBeats;
  });
  return { items, totalBeats: pos, order, spans };
}

function beatToX(beat, spans){
  if(!spans || !spans.length) return L.BAR_X0;
  let s = spans[0];
  for(let i=0; i<spans.length; i++){
    if(beat >= spans[i].startBeat) s = spans[i]; else break;
  }
  const mDur = measureDuration(state.measures[s.mi]) || (DIV*4);
  const frac = clamp((beat - s.startBeat) / (s.durBeats || 1), 0, 1);
  return startToX(s.mi, frac * mDur);
}

/* ============================================================
   PLAYBACK
   ============================================================ */
function togglePlay(){ playing ? stopPlayback() : startPlayback(); }

function startPlayback(){
  if(playing) return;
  initAudio();
  if(audioCtx.state === "suspended") audioCtx.resume();
  const { items, totalBeats, order, spans } = buildTimeline();
  const audible = items.filter(i => !i.rest);
  if(!audible.length){ setStatus("No notes to play"); return; }
  const spb = 60 / (state.tempo || 120);
  playing = true;
  $("btnPlay").classList.add("active");
  viewport.scrollLeft = 0;
  const t0 = audioCtx.currentTime + 0.12;
  const inst = instrumentName();
  audible.forEach(it => synth(freqOf(it.midi), t0 + it.startBeat * spb, it.durBeat * spb * 0.95, inst));

  const elMap = new Map();
  svgRoot.querySelectorAll("[data-note-id]").forEach(el => {
    if(!elMap.has(el.dataset.noteId)) elMap.set(el.dataset.noteId, el);
  });

  playback = { items, t0, spb, totalBeats, snap:true, order, spans, elMap };

  const ph = document.getElementById("playhead");
  if(ph){
    ph.setAttribute("y1", L.STAFF_TOP - 20);
    ph.setAttribute("y2", systemBottom() + 20);
    ph.style.display = "";
  }

  const repeatInfo = hasAnyRepeat() ? ` 🔁 (order: ${order.map(i => i+1).join("→")})` : "";
  setStatus("Playing…" + repeatInfo);
  animFrame = requestAnimationFrame(loop);
}

function loop(){
  if(!playing || !playback) return;
  const now = audioCtx.currentTime - playback.t0;
  if(now < 0){ animFrame = requestAnimationFrame(loop); return; }

  const endTime = playback.totalBeats * playback.spb;
  const curBeat = Math.min(now / playback.spb, playback.totalBeats);

  svgRoot.querySelectorAll(".note-playing").forEach(e => e.classList.remove("note-playing"));
  for(let i = 0; i < playback.items.length; i++){
    const it = playback.items[i];
    if(now >= it.startBeat * playback.spb && now < (it.startBeat + it.durBeat) * playback.spb){
      const el = playback.elMap.get(it.id);
      if(el) el.classList.add("note-playing");
    }
  }

  const x = beatToX(curBeat, playback.spans);
  const ph = document.getElementById("playhead");
  if(ph){
    ph.setAttribute("x1", x); ph.setAttribute("x2", x);
    ph.setAttribute("y1", L.STAFF_TOP - 20);
    ph.setAttribute("y2", systemBottom() + 20);
    ph.style.display = "";
  }
  autoScrollTo(x);

  if(now >= endTime){ stopPlayback(); return; }
  animFrame = requestAnimationFrame(loop);
}

function autoScrollTo(svgX){
  if(!viewport) return;
  if(performance.now() < state.userScrollUntil) return;

  const zoom = state.zoom;
  const noteCenterPx = svgX * zoom;
  const viewW = viewport.clientWidth;
  const maxScroll = Math.max(0, viewport.scrollWidth - viewW);
  const anchor = viewW * 0.35;
  const target = clamp(noteCenterPx - anchor, 0, maxScroll);

  if(playback && playback.snap){ viewport.scrollLeft = target; playback.snap = false; return; }

  const diff = target - viewport.scrollLeft;
  if(Math.abs(diff) < 0.4) return;
  if(Math.abs(diff) > viewW * 1.2){ viewport.scrollLeft = target; return; }
  viewport.scrollLeft += diff * 0.30;
}

(function(){
  const mark = () => { state.userScrollUntil = performance.now() + 1800; };
  viewport.addEventListener("wheel", mark, {passive:true});
  viewport.addEventListener("touchstart", mark, {passive:true});
  viewport.addEventListener("touchmove", mark, {passive:true});
  viewport.addEventListener("pointerdown", mark);
})();

function stopPlayback(update){
  if(update === undefined) update = true;
  playing = false;
  if(animFrame){ cancelAnimationFrame(animFrame); animFrame = null; }
  svgRoot.querySelectorAll(".note-playing").forEach(e => e.classList.remove("note-playing"));
  const ph = document.getElementById("playhead");
  if(ph) ph.style.display = "none";
  playback = null;
  $("btnPlay").classList.remove("active");
  if(update) setStatus("Stopped");
}

/* ============================================================
   MIC RECORDING
   ============================================================ */
const micState = {
  listening: false,
  analyser: null,
  stream: null,
  timeBuf: null,
  rafId: null,
  lastNoteName: "",
  stableCount: 0,
  STABLE_THRESHOLD: 4,
  SILENCE_TIMEOUT: 350,
  lastNoteTime: 0,
  lastRecordedMidi: -1,
  lastRecordedTime: 0,
  micCtx: null,

  /* --- Silence tracking --- */
  inSilence: true,
  silenceStartTime: 0,
  lastSilenceStart: 0,
  lastSilenceEnd: 0,
  lastOnsetMs: 0,
  lastStartDiv: 0,
  lastDurDiv: 0,
  lastMi: 0,
  lastNoteObj: null
};

function autoCorrelate(buf, sampleRate){
  const SIZE = buf.length;
  let rms = 0;
  for(let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if(rms < 0.01) return { freq: -1, rms };
  let r1 = 0, r2 = SIZE - 1;
  const thres = 0.2;
  for(let i = 0; i < SIZE/2; i++){
    if(Math.abs(buf[i]) < thres){ r1 = i; break; }
  }
  for(let i = 1; i < SIZE/2; i++){
    if(Math.abs(buf[SIZE - i]) < thres){ r2 = SIZE - i; break; }
  }
  const trimmed = buf.slice(r1, r2);
  const newSize = trimmed.length;
  if(newSize < 100) return { freq: -1, rms };
  const c = new Float32Array(newSize);
  for(let i = 0; i < newSize; i++){
    for(let j = 0; j < newSize - i; j++){
      c[i] += trimmed[j] * trimmed[j + i];
    }
  }
  let d = 0;
  while(d < newSize - 1 && c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for(let i = d; i < newSize; i++){
    if(c[i] > maxval){ maxval = c[i]; maxpos = i; }
  }
  let T0 = maxpos;
  if(T0 < 1 || T0 >= newSize - 1) return { freq: -1, rms };
  const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  if(a) T0 = T0 - b / (2 * a);
  return { freq: sampleRate / T0, rms };
}

async function micEnsureAudio(){
  if(!micState.micCtx){
    micState.micCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(micState.micCtx.state === "suspended") await micState.micCtx.resume();
  return micState.micCtx;
}

async function micStart(){
  if(location.protocol === "file:"){
    const msg =
      "❌ مرورگر در حالت file:// اجازه میکروفون نمی‌دهد.\n\n" +
      "راه‌حل:\n" +
      "  1) در پوشه فایل، ترمینال باز کنید\n" +
      "  2) اجرا کنید:  python -m http.server 8000\n" +
      "  3) در مرورگر باز کنید:  http://localhost:8000/maestro-mic.html";
    alert(msg);
    setStatus("❌ میکروفون روی file:// کار نمی‌کند — از http://localhost استفاده کنید");
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert("❌ مرورگر شما از getUserMedia پشتیبانی نمی‌کند.");
    setStatus("❌ getUserMedia پشتیبانی نمی‌شود");
    return;
  }
  try {
    await micEnsureAudio();
    micState.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const source = micState.micCtx.createMediaStreamSource(micState.stream);
    micState.analyser = micState.micCtx.createAnalyser();
    micState.analyser.fftSize = 2048;
    micState.timeBuf = new Float32Array(micState.analyser.fftSize);
    source.connect(micState.analyser);

    micState.listening = true;
    state.micListening = true;

    /* Full reset of silence detection state */
    micState.inSilence        = true;
    micState.silenceStartTime = 0;
    micState.lastSilenceStart = 0;
    micState.lastSilenceEnd   = 0;
    micState.lastOnsetMs      = 0;
    micState.lastStartDiv     = 0;
    micState.lastDurDiv       = 0;
    micState.lastMi           = state.micActiveMi || 0;
    micState.lastNoteObj      = null;
    micState.lastNoteName     = "";
    micState.stableCount      = 0;
    micState.lastRecordedMidi = -1;
    micState.lastRecordedTime = 0;

    $("micStartBtn").disabled = true;
    $("micStopBtn").disabled = false;
    $("micRecIndicator").innerHTML = '<span class="mic-rec-dot"></span>در حال شنیدن...';
    $("micBadge").classList.add("on");
    setStatus("🎤 در حال شنیدن — یک نت بزنید یا بخوانید");
    micAnalyze();
  } catch(err){
    console.error("Mic error:", err);
    const isNotAllowed = err.name === "NotAllowedError" || err.name === "PermissionDeniedError";
    const isNotFound   = err.name === "NotFoundError" || err.name === "DevicesNotFoundError";
    const isInsecure   = err.name === "SecurityError";
    let msg;
    if(isInsecure){
      msg = "❌ اجازه میکروفون در محیط ناامن رد شد.\nاز http://localhost یا https:// استفاده کنید.";
    } else if(isNotAllowed){
      msg =
        "❌ اجازه میکروفون رد شد.\n\n" +
        "راه‌حل:\n" +
        "  1) آیکون قفل 🔒 در نوار آدرس را بزنید\n" +
        "  2) Microphone → Allow\n" +
        "  3) صفحه را رفرش کنید";
    } else if(isNotFound){
      msg = "❌ میکروفونی پیدا نشد.\nمطمئن شوید میکروفون وصل و در تنظیمات سیستم فعال است.";
    } else {
      msg = "❌ خطای میکروفون: " + err.name + " — " + err.message;
    }
    alert(msg);
    setStatus(msg.split("\n")[0]);
    $("micStartBtn").disabled = false;
    $("micStopBtn").disabled = true;
    $("micRecIndicator").innerHTML = "";
  }
}

function micStop(){
  micState.listening = false;
  state.micListening = false;
  if(micState.rafId){ cancelAnimationFrame(micState.rafId); micState.rafId = null; }
  if(micState.stream){
    micState.stream.getTracks().forEach(t => t.stop());
    micState.stream = null;
  }
  $("micStartBtn").disabled = false;
  $("micStopBtn").disabled = true;
  $("micRecIndicator").innerHTML = "";
  $("micBadge").classList.remove("on");
  $("micNote").textContent = "—";
  $("micNote").className = "mic-note";
  $("micFreq").textContent = "—";
  $("micCents").textContent = "—";
  $("micNeedle").style.left = "50%";
  setStatus("ضبط متوقف شد");
  render();
}

function micAnalyze(){
  if(!micState.listening) return;
  micState.analyser.getFloatTimeDomainData(micState.timeBuf);
  const { freq, rms } = autoCorrelate(micState.timeBuf, micState.micCtx.sampleRate);

  const soundDetected = (freq > 60 && freq < 2000 && rms > 0.015);
  const now = performance.now();

  if(soundDetected){
    /* End of silence → record onset of current note */
    if(micState.inSilence){
      micState.lastSilenceStart = micState.silenceStartTime || now;
      micState.lastSilenceEnd   = now;
      micState.inSilence = false;
    }

    const midi = freqToMidi(freq);
    const name = NOTE_NAMES[((midi % 12) + 12) % 12];
    const octave = Math.floor(midi / 12) - 1;
    const full = name + octave;
    const cents = centsOff(freq, midi);

    $("micNote").textContent = full;
    $("micNote").className = "mic-note active" + (Math.abs(cents) < 15 ? " clean" : "");
    $("micFreq").textContent = freq.toFixed(1);
    $("micCents").textContent = (cents > 0 ? "+" : "") + cents;

    const needle = $("micNeedle");
    const pos = 50 + clamp(cents, -50, 50);
    needle.style.left = `calc(${pos}% - 3px)`;
    needle.style.background = Math.abs(cents) < 15 ? "#22c55e" : "#fbbf24";

    if(full === micState.lastNoteName){
      micState.stableCount++;
      if(micState.stableCount === micState.STABLE_THRESHOLD){
        micRecordNote(name, octave, freq);
        micState.lastNoteTime = now;
      }
    } else {
      micState.lastNoteName = full;
      micState.stableCount = 1;
    }
  } else {
    /* Start of silence */
    if(!micState.inSilence){
      micState.silenceStartTime = now;
      micState.inSilence = true;
    }
    if(now - micState.lastNoteTime > micState.SILENCE_TIMEOUT){
      if($("micNote").textContent !== "—"){
        $("micNote").textContent = "—";
        $("micNote").className = "mic-note";
        $("micFreq").textContent = "—";
        $("micCents").textContent = "—";
        $("micNeedle").style.left = "50%";
      }
      micState.lastNoteName = "";
      micState.stableCount = 0;
    }
  }
  micState.rafId = requestAnimationFrame(micAnalyze);
}

/* ============================================================
   MIC → SCORE HELPERS
   ============================================================ */
function ensureMeasuresUpTo(idx){
  while(state.measures.length <= idx){
    const prev = state.measures[state.measures.length - 1];
    state.measures.push(makeMeasure(state.measures.length + 1, prev));
  }
}

/* Insert rest notes to fill a range of divisions in a given measure.
   Uses greedy largest-first rest values to cover the gap. */
function insertRests(mi, fromDiv, toDiv){
  const m = state.measures[mi];
  if(!m) return;
  let pos  = Math.max(0, Math.round(fromDiv));
  const end = Math.round(toDiv);
  if(end <= pos) return;

  const durations = [32, 16, 8, 4, 2, 1];
  let guard = 0;
  while(pos < end && guard++ < 500){
    const remaining = end - pos;
    let dur = 1;
    for(const d of durations){
      if(d <= remaining){ dur = d; break; }
    }
    /* Skip if a real note starts exactly at pos */
    const conflict = (m.notes || []).some(n =>
      (n.start || 0) === pos && n.rest !== true
    );
    if(!conflict){
      m.notes.push({
        step:"B", octave:4, alter:0,
        start: pos, duration: dur,
        rest: true, dotted:false, tuplet:0, dynamic:""
      });
    }
    pos += dur;
  }
  m.notes.sort((a,b) => (a.start||0) - (b.start||0));
}

function micRecordNote(name, octave, freq){
  if(!$("micAutoAdd").checked) return;
  const midi = (octave + 1) * 12 + NOTE_NAMES.indexOf(name);
  const now  = performance.now();

  /* Ignore only near-instant duplicate detections; don't suppress repeated notes. */
  if(midi === micState.lastRecordedMidi && now - micState.lastRecordedTime < 140) return;

  const p = midiToPitch(midi);
  const fallbackDurDiv = Number($("micDuration").value) || DUR.quarter;
  const insertRestsEnabled = $("micInsertRests").checked;
  const quantizeMode = ($("micMode").value || "quantize") === "quantize";
  const beatMs = 60000 / (state.tempo || 120);
  const divMs = beatMs / DIV;
  const quantizeDiv = v => quantizeMode ? Math.max(0, Math.round(v / 2) * 2) : Math.max(0, Math.round(v));

  let mi = state.micActiveMi;
  if(mi < 0 || mi >= state.measures.length) mi = 0;
  ensureMeasuresUpTo(mi);

  const isFirstNote = (micState.lastOnsetMs === 0 || !micState.lastNoteObj);
  let localStart = 0;
  let prevEndMi = mi;
  let prevEndDiv = 0;
  let restDivs = 0;
  let noteDurDiv = fallbackDurDiv;

  if(isFirstNote){
    let maxEnd = 0;
    (state.measures[mi].notes || []).forEach(n => {
      maxEnd = Math.max(maxEnd, (n.start || 0) + (n.duration || 0));
    });
    localStart = maxEnd;
    prevEndMi = mi;
    prevEndDiv = maxEnd;
  } else {
    /* Measure the interval between detected note onsets and the actual silent gap.
       The previous note's duration is inferred from this interval, not kept fixed. */
    const intervalMs = Math.max(divMs, now - micState.lastOnsetMs);
    let intervalDivs = Math.max(1, quantizeDiv(intervalMs / divMs));
    if(quantizeMode) intervalDivs = Math.max(2, intervalDivs);

    if(micState.lastSilenceStart > 0 && micState.lastSilenceEnd > micState.lastSilenceStart){
      const silentMs = micState.lastSilenceEnd - micState.lastSilenceStart;
      restDivs = quantizeDiv(silentMs / divMs);
    }
    /* A gap cannot consume the whole interval: leave at least one division for the note. */
    restDivs = Math.min(restDivs, Math.max(0, intervalDivs - 1));
    const inferredDur = Math.max(1, intervalDivs - restDivs);

    /* Update the previous note in-place, so its duration follows the performance. */
    if(micState.lastNoteObj){
      micState.lastNoteObj.duration = inferredDur;
      const prevMeasure = state.measures[micState.lastMi];
      if(prevMeasure) prevMeasure.notes.sort((a,b) => (a.start||0) - (b.start||0));
    }
    micState.lastDurDiv = inferredDur;
    mi = micState.lastMi;
    ensureMeasuresUpTo(mi);
    prevEndMi = mi;
    prevEndDiv = micState.lastStartDiv + inferredDur;
    localStart = prevEndDiv + restDivs;

    micState.lastSilenceStart = 0;
    micState.lastSilenceEnd = 0;
  }

  /* Carry the timeline into later measures without inserting a fixed-length gap. */
  let mDur = measureDuration(state.measures[mi]);
  while(localStart >= mDur){
    localStart -= mDur;
    mi++;
    ensureMeasuresUpTo(mi);
    mDur = measureDuration(state.measures[mi]);
  }
  if(localStart + noteDurDiv > mDur && isFirstNote){
    localStart = 0;
    mi++;
    ensureMeasuresUpTo(mi);
  }

  pushUndo();

  if(!isFirstNote && insertRestsEnabled){
    const endOfPrevMi = measureDuration(state.measures[prevEndMi]);
    if(prevEndMi === mi){
      if(localStart > prevEndDiv) insertRests(mi, prevEndDiv, localStart);
    } else {
      if(prevEndDiv < endOfPrevMi) insertRests(prevEndMi, prevEndDiv, endOfPrevMi);
      for(let mmi = prevEndMi + 1; mmi < mi; mmi++){
        insertRests(mmi, 0, measureDuration(state.measures[mmi]));
      }
      if(localStart > 0) insertRests(mi, 0, localStart);
    }
  }

  const noteObj = {
    step: p.step, octave: p.octave, alter: p.alter,
    start: localStart, duration: noteDurDiv,
    rest: false, dotted: false, tuplet: 0, dynamic: "",
    _fromMic: true
  };
  state.measures[mi].notes.push(noteObj);
  state.measures[mi].notes.sort((a,b) => (a.start||0) - (b.start||0));

  micState.lastRecordedMidi = midi;
  micState.lastRecordedTime = now;
  micState.lastOnsetMs = now;
  micState.lastStartDiv = localStart;
  micState.lastDurDiv = noteDurDiv;
  micState.lastMi = mi;
  micState.lastNoteObj = noteObj;
  state.micActiveMi = mi;

  const gapInfo = (!isFirstNote && restDivs > 0) ? " (سکوت واقعی)" : "";
  setStatus(`🎤 ثبت شد: ${midiName(midi)} در میزان ${mi+1} موقعیت ${localStart}${gapInfo}`);
  render();

  try {
    const xPx = startToX(mi, localStart) * state.zoom;
    const target = Math.max(0, xPx - viewport.clientWidth * 0.35);
    state.userScrollUntil = 0;
    if(typeof viewport.scrollTo === "function") viewport.scrollTo({ left: target, behavior: "smooth" });
    else viewport.scrollLeft = target;
  } catch(e){}
}

/* ============================================================
   FILE SAVE — asks for LOCATION + FILENAME
   ============================================================ */
let lastSaveDirHandle = null;

function canUseSavePicker(){
  return !!(window.showSaveFilePicker && window.isSecureContext && location.protocol !== "file:");
}
function canUseDirPicker(){
  return !!(window.showDirectoryPicker && window.isSecureContext && location.protocol !== "file:");
}

function askFileName(suggested){
  const dot = suggested.lastIndexOf(".");
  const base = dot > 0 ? suggested.slice(0, dot) : suggested;
  const ext  = dot > 0 ? suggested.slice(dot) : "";
  let ans;
  try {
    ans = window.prompt("نام فایل را وارد کنید (پسوند " + ext + " خودکار اضافه می‌شود):", base);
  } catch(e){
    ans = base;
  }
  if(ans === null) return null;
  ans = (ans || "").trim().replace(/[\\/:*?"<>|]+/g, "");
  if(!ans) ans = base;
  if(ext && !ans.toLowerCase().endsWith(ext.toLowerCase())) ans += ext;
  return ans;
}

async function saveWithDialog(data, suggestedName, mime, description){
  const dotIdx = suggestedName.lastIndexOf(".");
  const rawExt = dotIdx > 0 ? suggestedName.slice(dotIdx + 1).toLowerCase() : "";
  const ext = rawExt ? "." + rawExt : "";
  let fname = askFileName(suggestedName);
  if(fname === null){ setStatus("ذخیره لغو شد"); return {ok:false,reason:"cancelled"}; }
  const fileMime = mime || "application/octet-stream";
  const blob = data instanceof Blob ? data : new Blob([data], {type:fileMime});
  if(canUseSavePicker()){
    try{
      setStatus("📂 در حال باز کردن پنجرهٔ ذخیره…");
      const types = ext ? [{description:description || "File",accept:{[fileMime]:[ext]}}] : [];
      const handle = await window.showSaveFilePicker({suggestedName:fname,types,excludeAcceptAllOption:false});
      const writable = await handle.createWritable(); await writable.write(blob); await writable.close();
      setStatus("✅ ذخیره شد: «"+handle.name+"»"); return {ok:true,name:handle.name,method:"picker"};
    }catch(err){ if(err && err.name === "AbortError"){setStatus("ذخیره لغو شد");return {ok:false,reason:"cancelled"};} console.warn("Save picker failed:",err); }
  }
  try{
    const file = new File([blob],fname,{type:fileMime,lastModified:Date.now()});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      setStatus("📤 در حال باز کردن اشتراک‌گذاری اندروید…");
      await navigator.share({files:[file],title:fname,text:"Maestro export"});
      setStatus("✅ فایل به برگهٔ اشتراک‌گذاری فرستاده شد."); return {ok:true,name:fname,method:"share"};
    }
  }catch(err){if(err && err.name === "AbortError"){setStatus("اشتراک‌گذاری لغو شد");return {ok:false,reason:"cancelled"};}console.warn("Share fallback failed:",err);}
  try{
    const url=URL.createObjectURL(blob),a=document.createElement("a"); a.href=url;a.download=fname;a.rel="noopener";a.style.position="fixed";a.style.left="-10000px";document.body.appendChild(a);a.click();
    setTimeout(()=>{try{a.remove();URL.revokeObjectURL(url)}catch(e){}},15000);
    setStatus("⬇️ درخواست دانلود «"+fname+"» ارسال شد. اگر فایل ذخیره نشد، WebView سازندهٔ APK باید دانلود را پشتیبانی کند.");return {ok:true,name:fname,method:"download-requested"};
  }catch(err){console.error("Download failed:",err);setStatus("⚠️ ذخیره‌سازی ناموفق بود: "+(err.message||err));return {ok:false,reason:"error",error:err};}
}

/* ============================================================
   EXPORT MusicXML
   ============================================================ */
function buildMusicXMLString(){
  const safe = s => (s||"").replace(/[<>&"]/g,"");
  let xml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">
<score-partwise version="3.1">
<work><work-title>${safe(state.title)}</work-title></work>
<identification>${state.composer ? `<creator type="composer">${safe(state.composer)}</creator>`:""}<encoding><software>Maestro+Mic Studio v5.4.2</software></encoding></identification>
<part-list><score-part id="P1"><part-name>${safe(state.instrument)}</part-name></score-part></part-list>
<part id="P1">`;

  state.measures.forEach((m, mi) => {
    xml += `\n<measure number="${mi+1}">`;
    const div = m.divisions || DIV;
    const prev = mi > 0 ? state.measures[mi-1] : null;
    const needsAttr = !prev || prev.divisions !== div ||
      prev.time.beats !== m.time.beats || prev.time.beatType !== m.time.beatType ||
      prev.key !== m.key || prev.clef !== m.clef;
    if(needsAttr){
      xml += `<attributes><divisions>${div}</divisions>
<key><fifths>${m.key}</fifths></key>
<time><beats>${m.time.beats}</beats><beat-type>${m.time.beatType}</beat-type></time>
<clef><sign>${m.clef === "bass" ? "F" : "G"}</sign><line>${m.clef === "bass" ? 4 : 2}</line></clef>
</attributes>`;
      if(mi === 0) xml += `<sound tempo="${state.tempo}"/>`;
    }

    if(m.repeatStart){
      xml += `<barline location="left"><bar-style>heavy-light</bar-style><repeat direction="forward"/></barline>`;
    }

    let cursor = 0;
    (m.notes||[]).slice().sort((a,b) => (a.start||0)-(b.start||0)).forEach(n => {
      const start = n.start || 0;
      const dur = n.duration || div;
      if(start > cursor){
        xml += `<forward><duration>${start - cursor}</duration></forward>`;
        cursor = start;
      }
      const isChord = start < cursor;
      const type = (function(d, dv){
        const q = d/dv;
        if(q >= 4) return "whole";
        if(q >= 2) return "half";
        if(q >= 1) return "quarter";
        if(q >= .5) return "eighth";
        if(q >= .25) return "16th";
        return "32nd";
      })(dur, div);
      if(n.rest){
        xml += `<note>${isChord?"<chord/>":""}<rest/><duration>${dur}</duration><voice>1</voice><type>${type}</type></note>`;
      } else {
        xml += `<note>${isChord?"<chord/>":""}<pitch><step>${n.step}</step>${n.alter?`<alter>${n.alter}</alter>`:""}<octave>${n.octave}</octave></pitch><duration>${dur}</duration><voice>1</voice><type>${type}</type></note>`;
      }
      if(!isChord) cursor = start + dur;
    });

    if(m.repeatEnd){
      xml += `<barline location="right"><bar-style>light-heavy</bar-style><repeat direction="backward"/></barline>`;
    } else if(mi === state.measures.length - 1){
      xml += `<barline location="right"><bar-style>light-heavy</bar-style></barline>`;
    }

    xml += `</measure>`;
  });
  xml += `\n</part>\n</score-partwise>`;
  return xml;
}

function scoreBaseName(){
  return ((state.title || "maestro-score").trim()
            .replace(/[\\/:*?"<>|]+/g, "")
            .replace(/\s+/g, "_") || "maestro-score");
}

async function exportMusicXML(){
  if(!state.measures.some(m => m.notes && m.notes.length)){
    setStatus("چیزی برای ذخیره نیست");
    alert("چیزی برای ذخیره نیست — اول نت اضافه کنید یا یک Sample بارگذاری کنید.");
    return;
  }
  const xml = buildMusicXMLString();
  const suggested = scoreBaseName() + ".musicxml";
  try {
    await saveWithDialog(xml, suggested, "application/xml", "MusicXML score");
  } catch(err){
    console.error(err);
    alert("Save failed:\n" + err.message);
  }
}

/* ============================================================
   MIDI IMPORT / EXPORT
   ============================================================ */
const MIDI_PPQ = 480;
const MIDI_TICKS_PER_DIV = MIDI_PPQ / DIV;

function midiWriteVarLen(value){
  const bytes = [value & 0x7F];
  value >>>= 7;
  while(value > 0){
    bytes.unshift((value & 0x7F) | 0x80);
    value >>>= 7;
  }
  return bytes;
}
function midiReadVarLen(bytes, offset){
  let value = 0, byte;
  do {
    byte = bytes[offset++];
    value = (value << 7) | (byte & 0x7F);
  } while(byte & 0x80);
  return { value, offset };
}

function buildMidiBytes(){
  const events = [];

  const usPerQuarter = Math.round(60000000 / (state.tempo || 120));
  events.push({
    tick: 0, priority: 0,
    data: [0xFF, 0x51, 0x03,
      (usPerQuarter >>> 16) & 0xFF,
      (usPerQuarter >>> 8) & 0xFF,
      usPerQuarter & 0xFF]
  });

  let tickOffset = 0;
  let prevTimeSigKey = null;

  state.measures.forEach(m => {
    const ts = m.time || { beats:4, beatType:4 };
    const key = ts.beats + "/" + ts.beatType;
    if(key !== prevTimeSigKey){
      const denomPower = Math.round(Math.log2(ts.beatType));
      events.push({
        tick: tickOffset, priority: 0,
        data: [0xFF, 0x58, 0x04, ts.beats, denomPower, 24, 8]
      });
      prevTimeSigKey = key;
    }

    (m.notes || []).forEach(n => {
      if(n.rest) return;
      const midi = pitchToMidi(n.step, n.octave, n.alter || 0);
      const startTick = tickOffset + Math.round((n.start || 0) * MIDI_TICKS_PER_DIV);
      const durTick = Math.max(1, Math.round((n.duration || DIV) * MIDI_TICKS_PER_DIV));
      events.push({ tick: startTick, priority: 1, data: [0x90, midi & 0x7F, 0x64] });
      events.push({ tick: startTick + durTick, priority: 0, data: [0x80, midi & 0x7F, 0x40] });
    });

    const mDur = measureDuration(m);
    tickOffset += Math.round(mDur * MIDI_TICKS_PER_DIV);
  });

  events.sort((a, b) => {
    if(a.tick !== b.tick) return a.tick - b.tick;
    return a.priority - b.priority;
  });

  const trackBytes = [];
  let lastTick = 0;
  events.forEach(e => {
    const delta = e.tick - lastTick;
    lastTick = e.tick;
    const vl = midiWriteVarLen(delta);
    for(const b of vl) trackBytes.push(b);
    for(const b of e.data) trackBytes.push(b);
  });
  trackBytes.push(0x00, 0xFF, 0x2F, 0x00);

  const totalLen = trackBytes.length;
  const out = new Uint8Array(14 + 8 + totalLen);
  let p = 0;
  out[p++] = 0x4D; out[p++] = 0x54; out[p++] = 0x68; out[p++] = 0x64;
  out[p++] = 0x00; out[p++] = 0x00; out[p++] = 0x00; out[p++] = 0x06;
  out[p++] = 0x00; out[p++] = 0x00;
  out[p++] = 0x00; out[p++] = 0x01;
  out[p++] = (MIDI_PPQ >>> 8) & 0xFF;
  out[p++] = MIDI_PPQ & 0xFF;
  out[p++] = 0x4D; out[p++] = 0x54; out[p++] = 0x72; out[p++] = 0x6B;
  out[p++] = (totalLen >>> 24) & 0xFF;
  out[p++] = (totalLen >>> 16) & 0xFF;
  out[p++] = (totalLen >>> 8) & 0xFF;
  out[p++] = totalLen & 0xFF;
  for(let i = 0; i < totalLen; i++) out[p++] = trackBytes[i];
  return out;
}

function parseMidiBytes(arrayBuffer){
  const bytes = new Uint8Array(arrayBuffer);
  let offset = 0;

  const readStr = n => {
    let s = "";
    for(let i = 0; i < n; i++) s += String.fromCharCode(bytes[offset++]);
    return s;
  };
  const readU16 = () => { const v = (bytes[offset] << 8) | bytes[offset+1]; offset += 2; return v; };
  const readU32 = () => {
    const v = ((bytes[offset] << 24) | (bytes[offset+1] << 16) |
               (bytes[offset+2] << 8)  |  bytes[offset+3]) >>> 0;
    offset += 4; return v;
  };

  if(bytes.length < 14) throw new Error("File too small");
  if(readStr(4) !== "MThd") throw new Error("Not a MIDI file (missing MThd)");
  const headerLen = readU32();
  const format = readU16();
  const nTracks = readU16();
  const division = readU16();
  offset += Math.max(0, headerLen - 6);

  if(division & 0x8000) throw new Error("SMPTE time division is not supported");
  const PPQ = division || 480;

  const tracks = [];
  const tempos = [];
  const timeSigs = [];

  for(let t = 0; t < nTracks && offset < bytes.length; t++){
    while(offset + 8 <= bytes.length &&
          !(bytes[offset] === 0x4D && bytes[offset+1] === 0x54 &&
            bytes[offset+2] === 0x72 && bytes[offset+3] === 0x6B)){
      offset++;
    }
    if(offset + 8 > bytes.length) break;
    readStr(4);
    const trackLen = readU32();
    const trackEnd = Math.min(bytes.length, offset + trackLen);
    const events = [];
    let tick = 0;
    let runningStatus = 0;

    while(offset < trackEnd){
      const r = midiReadVarLen(bytes, offset);
      const delta = r.value; offset = r.offset;
      tick += delta;
      if(offset >= trackEnd) break;

      let status = bytes[offset];
      if(status >= 0x80){
        offset++;
        if(status < 0xF0) runningStatus = status;
      } else {
        status = runningStatus;
      }

      if(status === 0xFF){
        const metaType = bytes[offset++];
        const r2 = midiReadVarLen(bytes, offset); offset = r2.offset;
        const len = r2.value;
        const data = bytes.slice(offset, offset + len);
        offset += len;

        if(metaType === 0x51 && len === 3){
          const usPerBeat = (data[0] << 16) | (data[1] << 8) | data[2];
          if(usPerBeat > 0) tempos.push({ tick, microsecondsPerBeat: usPerBeat });
        } else if(metaType === 0x58 && len >= 2){
          timeSigs.push({ tick, numerator: data[0], denominator: Math.pow(2, data[1]) });
        }
      } else if(status === 0xF0 || status === 0xF7){
        const r2 = midiReadVarLen(bytes, offset); offset = r2.offset;
        offset += r2.value;
      } else {
        const type = status & 0xF0;
        if(type === 0x80 || type === 0x90){
          const note = bytes[offset++];
          const vel = bytes[offset++];
          events.push({
            tick, note, velocity: vel,
            type: (type === 0x90 && vel > 0) ? "noteOn" : "noteOff"
          });
        } else if(type === 0xA0 || type === 0xB0 || type === 0xE0){
          offset += 2;
        } else if(type === 0xC0 || type === 0xD0){
          offset += 1;
        } else {
          break;
        }
      }
    }
    offset = trackEnd;
    tracks.push({ events });
  }

  return { format, PPQ, tracks, tempos, timeSigs };
}

function midiToScore(parsed){
  const { PPQ, tracks, tempos, timeSigs } = parsed;
  const ticksPerDiv = PPQ / DIV;

  const allNotes = [];
  let maxTick = 0;

  tracks.forEach(trk => {
    const pending = new Map();
    trk.events.forEach(e => {
      if(e.type === "noteOn"){
        if(!pending.has(e.note)) pending.set(e.note, []);
        pending.get(e.note).push({ tick: e.tick, velocity: e.velocity });
      } else if(e.type === "noteOff"){
        const arr = pending.get(e.note);
        if(arr && arr.length){
          const on = arr.shift();
          const durTick = Math.max(1, e.tick - on.tick);
          allNotes.push({ midi: e.note, startTick: on.tick, durTick, velocity: on.velocity });
          maxTick = Math.max(maxTick, on.tick + durTick);
        }
      }
    });
  });

  if(!allNotes.length) throw new Error("No notes found in MIDI file");

  let tempo = 120;
  if(tempos.length) {
    tempo = Math.round(60000000 / tempos[0].microsecondsPerBeat);
    tempo = clamp(tempo, 20, 300);
  }

  let timeSig = { beats: 4, beatType: 4 };
  if(timeSigs.length){
    timeSig = { beats: timeSigs[0].numerator, beatType: timeSigs[0].denominator };
  }

  const measureQuarters = timeSig.beats * (4 / timeSig.beatType);
  const measureTicks    = measureQuarters * PPQ;
  const measureDivs     = measureQuarters * DIV;

  const numMeasures = Math.max(1, Math.ceil(maxTick / measureTicks));

  const measures = [];
  for(let i = 0; i < numMeasures; i++){
    measures.push({
      number: i + 1,
      divisions: DIV,
      time: { ...timeSig },
      key: 0,
      clef: "treble",
      repeatStart: false,
      repeatEnd: false,
      notes: []
    });
  }

  allNotes.forEach(n => {
    const startDiv = Math.round(n.startTick / ticksPerDiv);
    const durDiv   = Math.max(1, Math.round(n.durTick / ticksPerDiv));
    let mi = Math.floor(startDiv / measureDivs);
    while(measures.length <= mi){
      const prev = measures[measures.length - 1];
      measures.push({
        number: measures.length + 1,
        divisions: DIV,
        time: { ...prev.time },
        key: prev.key,
        clef: prev.clef,
        repeatStart: false,
        repeatEnd: false,
        notes: []
      });
    }
    const localStart = startDiv - mi * measureDivs;
    const p = midiToPitch(n.midi);
    measures[mi].notes.push({
      step: p.step,
      octave: p.octave,
      alter: p.alter,
      start: localStart,
      duration: durDiv,
      rest: false,
      dotted: false,
      tuplet: 0,
      dynamic: ""
    });
  });

  measures.forEach(m => m.notes.sort((a, b) => (a.start || 0) - (b.start || 0)));

  return { measures, tempo, timeSig };
}

async function exportMidi(){
  if(!state.measures.some(m => m.notes && m.notes.length)){
    setStatus("چیزی برای ذخیره نیست");
    alert("چیزی برای ذخیره نیست — اول نت اضافه کنید یا یک Sample بارگذاری کنید.");
    return;
  }
  const bytes = buildMidiBytes();
  const suggested = scoreBaseName() + ".mid";
  try {
    await saveWithDialog(bytes, suggested, "audio/midi", "Standard MIDI File");
  } catch(err){
    console.error(err);
    alert("MIDI export failed:\n" + err.message);
  }
}

async function importMidiFile(file){
  setStatus("Importing " + file.name + "…");
  const buf = await file.arrayBuffer();
  const parsed = parseMidiBytes(buf);
  const { measures, tempo } = midiToScore(parsed);

  pushUndo();
  state.measures = measures;
  state.selection = null;

}

async function importFile(file){
  setStatus("Importing " + file.name + "…");
  if(/\.(mid|midi)$/i.test(file.name)) { await importMidiFile(file); return; }
  if(/\.mxl$/i.test(file.name)) await importMXL(file);
  else importMusicXML(await file.text());
}

async function importMXL(file){
  if(typeof JSZip === "undefined") throw new Error("JSZip not loaded");
  const zip = await JSZip.loadAsync(file);
  let xmlFile = null;
  const container = zip.file("META-INF/container.xml");
  if(container){
    const ct = await container.async("text");
    const cd = new DOMParser().parseFromString(ct, "application/xml");
    const rf = cd.querySelector("rootfile");
    if(rf) xmlFile = rf.getAttribute("full-path");
  }
  if(!xmlFile || !zip.file(xmlFile)){
    xmlFile = Object.keys(zip.files).find(n =>
      !n.startsWith("__MACOSX") && !n.split("/").pop().startsWith("._") &&
      /\.(musicxml|xml)$/i.test(n));
  }
  if(!xmlFile) throw new Error("No MusicXML file inside MXL");
  importMusicXML(await zip.file(xmlFile).async("text"));
}

function importMusicXML(text){
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if(doc.querySelector("parsererror")) throw new Error("Invalid XML");
  const part = doc.querySelector("part");
  if(!part) throw new Error("No <part> element found");

  const wt = doc.querySelector("work-title");
  if(wt) state.title = wt.textContent.trim() || "Untitled";
  const cp = doc.querySelector("identification creator[type='composer']");
  if(cp) state.composer = cp.textContent.trim();

  const sound = doc.querySelector("sound[tempo]");
  if(sound){
    const t = Number(sound.getAttribute("tempo"));
    if(t > 20 && t < 400) state.tempo = Math.round(t);
  }

  const measureNodes = [...part.children].filter(n => n.localName === "measure");
  if(!measureNodes.length) throw new Error("No measures");

  let divisions = DIV, beats = 4, beatType = 4, fifths = 0, clef = "treble";
  const parsed = measureNodes.map((mn, mi) => {
    const attr = [...mn.children].find(n => n.localName === "attributes");
    if(attr){
      const d = [...attr.children].find(n => n.localName === "divisions");
      if(d) divisions = Number(d.textContent) || divisions;
      const t = [...attr.children].find(n => n.localName === "time");
      if(t){
        const b = t.querySelector("beats"); if(b) beats = Number(b.textContent);
        const bt = t.querySelector("beat-type"); if(bt) beatType = Number(bt.textContent);
      }
      const k = [...attr.children].find(n => n.localName === "key");
      if(k){ const f = k.querySelector("fifths"); if(f) fifths = Number(f.textContent); }
      const c = [...attr.children].find(n => n.localName === "clef");
      if(c){
        const s = c.querySelector("sign");
        if(s) clef = s.textContent === "F" ? "bass" : (s.textContent === "C" ? "alto" : "treble");
      }
    }
    let repeatStart = false, repeatEnd = false;
    [...mn.children].forEach(node => {
      if(node.localName !== "barline") return;
      const loc = node.getAttribute("location");
      const rep = node.querySelector(":scope > repeat");
      if(rep){
        const dir = rep.getAttribute("direction");
        if(dir === "forward"  && loc === "left")  repeatStart = true;
        if(dir === "backward" && loc === "right") repeatEnd   = true;
      }
    });
    const notes = [];
    let cursor = 0, lastStart = 0;
    [...mn.children].forEach(node => {
      const tag = node.localName;
      if(tag === "backup"){ cursor = Math.max(0, cursor - (Number(node.querySelector("duration")?.textContent)||0)); return; }
      if(tag === "forward"){ cursor += Number(node.querySelector("duration")?.textContent)||0; return; }
      if(tag !== "note") return;
      if(node.querySelector(":scope > grace")) return;
      const isChord = !!node.querySelector(":scope > chord");
      const isRest  = !!node.querySelector(":scope > rest");
      const dur = Number(node.querySelector(":scope > duration")?.textContent) || divisions;
      const start = isChord ? lastStart : cursor;
      if(isRest){
        notes.push({ rest:true, step:"B", octave:4, alter:0, start, duration:dur });
      } else {
        const p = node.querySelector(":scope > pitch");
        if(p){
          const step = p.querySelector("step")?.textContent || "C";
          const octave = Number(p.querySelector("octave")?.textContent ?? 4);
          const alter = Number(p.querySelector("alter")?.textContent) || 0;
          notes.push({ step, octave, alter, start, duration:dur, rest:false });
        }
      }
      if(!isChord){ lastStart = start; cursor = start + dur; }
    });
    notes.sort((a,b) => (a.start||0) - (b.start||0));
    return { number: Number(mn.getAttribute("number")) || mi+1,
      divisions, time:{beats, beatType}, key:fifths, clef,
      repeatStart, repeatEnd, notes };
  });

  pushUndo();
  state.measures = parsed;
  state.selection = null;
  state.activeMi = 0;
  state.micActiveMi = 0;

  const pn = doc.querySelector("part-name")?.textContent || "";
  if(/guitar/i.test(pn)){
    state.instrument = "Nylon Guitar";
    state.showTab = true;
    state.arpeggio = true;
  }

  render();
  viewport.scrollLeft = 0;
  const repInfo = hasAnyRepeat() ? `  🔁 order: ${getPlaybackOrder().map(i=>i+1).join("→")}` : "";
  setStatus(`✅ Imported ${state.measures.length} bars from "${state.title}"${repInfo}`);
}
